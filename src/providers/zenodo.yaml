name: zenodo
displayName: Zenodo
description: Zenodo — open research data repository hosted by CERN for datasets, software, and publications
tags:
  - data-repository
  - research-data
  - open-access
  - zenodo
baseUrl: https://zenodo.org/api
tools:
  searchRecords:
    description: Search Zenodo records (datasets, publications, software)
    tags:
      - record-search
      - data-search
    method: GET
    path: /records
    params:
      q:
        type: string
        required: true
        description: Search query (e.g. BRCA1 cancer, single-cell RNA-seq)
      type:
        type: string
        description: Record type filter (dataset, publication, software, poster, presentation)
      size:
        type: integer
        default: 10
        description: Number of results to return
      sort:
        type: string
        default: bestmatch
        description: Sort order (bestmatch, mostrecent, -mostrecent)
    response:
      format: json
      fields:
        - hits.total
        - hits.hits[].id
        - hits.hits[].doi
        - hits.hits[].metadata.title
        - hits.hits[].metadata.publication_date
        - hits.hits[].metadata.resource_type.type
        - hits.hits[].metadata.description
  getRecord:
    description: Get metadata for a specific Zenodo record by ID
    tags:
      - record-info
      - dataset-info
    method: GET
    path: /records/{recordId}
    params:
      recordId:
        type: integer
        required: true
        description: Zenodo record ID
    response:
      format: json
      fields:
        - id
        - doi
        - metadata.title
        - metadata.description
        - metadata.publication_date
        - metadata.creators[].name
        - metadata.resource_type.type
        - files[].filename
        - files[].size
tests:
  searchRecords:
    - name: searches for genomics datasets
      params:
        q: genomics
        size: 3
      assert:
        - path: hits.total
        - path: hits.hits
          minLength: 1
