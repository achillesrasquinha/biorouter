name: cdc-open-data
displayName: CDC Open Data
description: CDC Open Data — public health datasets via the Socrata Open Data API
tags:
- public-health
- cdc
- open-data
- socrata
- health-statistics
baseUrl: https://data.cdc.gov/resource
tools:
  queryDataset:
    description: Query a specific CDC dataset by dataset ID using SoQL filters
    tags:
    - dataset-query
    - public-health-query
    method: GET
    path: /{datasetId}.json
    params:
      datasetId:
        type: string
        required: true
        description: Socrata dataset identifier (e.g. "bi63-dtpu" for chronic disease indicators)
      $where:
        type: string
        description: SoQL WHERE clause to filter results (e.g. "yearstart='2020'")
      $limit:
        type: integer
        default: 10
        description: Maximum number of records to return
      $select:
        type: string
        description: Comma-separated list of columns to return (e.g. "yearstart,locationdesc,topic")
    response:
      format: json
      fields:
      - '[].year'
      - '[].cause_name'
      - '[].state'
      - '[].deaths'
      - '[].aadr'
    entity: dataset
  searchDatasets:
    description: Search the CDC data catalog for available datasets
    tags:
    - dataset-search
    - catalog-search
    baseUrl: https://api.us.socrata.com/api/catalog/v1
    method: GET
    path: /
    params:
      q:
        type: string
        required: true
        description: Search query (e.g. "COVID-19", "vaccination", "mortality")
      domains:
        type: string
        default: data.cdc.gov
        description: Domain to search within
      limit:
        type: integer
        default: 10
        description: Maximum number of results
    response:
      format: json
      fields:
      - results[].resource.name
      - results[].resource.description
      - results[].resource.id
      - results[].resource.updatedAt
    entity: dataset
tests:
  queryDataset:
  - name: queries chronic disease indicators dataset
    params:
      datasetId: bi63-dtpu
      $limit: 5
    assert:
    - minLength: 1
    allowError: true
  searchDatasets:
  - name: searches CDC catalog for COVID-19 datasets
    params:
      q: COVID-19
      domains: data.cdc.gov
      limit: 5
    assert:
    - minLength: 1
    allowError: true
