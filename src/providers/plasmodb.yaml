name: plasmodb
displayName: PlasmoDB
description: PlasmoDB — VEuPathDB resource for Plasmodium (malaria parasite) genomics
tags:
- malaria
- plasmodium
- parasite
- veupathdb
- genomics
baseUrl: https://plasmodb.org/plasmo/service
tools:
  listRecordTypes:
    description: List available record types in PlasmoDB
    tags:
    - record-types
    - metadata
    method: GET
    path: /record-types
    params: {}
    response:
      format: json
    entity: dataset
  search:
    description: Search PlasmoDB for genes, proteins, and genomic features
    tags:
    - gene-search
    - parasite-search
    method: GET
    path: /search
    params:
      q:
        type: string
        required: true
        description: Search query (e.g. PF3D7_1133400, hemoglobin, kinase)
      format:
        type: string
        default: json
        description: Response format
      size:
        type: integer
        default: 10
        description: Number of results
    response:
      format: json
    entity: gene
tests:
  listRecordTypes:
  - name: lists record types
    params: {}
    assert:
    - minLength: 1
