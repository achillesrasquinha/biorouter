name: node-normalization
displayName: RENCI Node Normalization
description: RENCI Node Normalization — Translator service normalizing CURIEs to canonical identifiers
tags:
  - normalization
  - identifier-mapping
  - translator
  - curie
baseUrl: https://nodenormalization-sri.renci.org
tools:
  getNormalizedNodes:
    description: Normalize CURIEs to their canonical form with equivalent identifiers
    tags:
      - curie-normalization
      - identifier-mapping
    method: GET
    path: /get_normalized_nodes
    params:
      curie:
        type: string
        required: true
        description: CURIE to normalize (e.g. HGNC:1100, CHEBI:15377, MONDO:0005148)
    response:
      format: json
tests:
  getNormalizedNodes:
    - name: normalizes HGNC:1100 (BRCA1)
      params:
        curie: HGNC:1100
      assert:
        - path: HGNC:1100
