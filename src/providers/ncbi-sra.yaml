name: ncbi-sra
displayName: NCBI SRA
description: Sequence Read Archive — raw sequencing data repository
tags:
- sequencing
- sra
- raw-data
- ncbi
- ngs
- rnaseq
baseUrl: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
tools:
  search:
    description: Search SRA studies by keyword
    tags:
    - sra-search
    - sequencing-search
    method: GET
    path: /esearch.fcgi
    params:
      db:
        type: string
        default: sra
      term:
        type: string
        required: true
        description: Search term e.g. 'cancer RNA-seq human'
      retmax:
        type: integer
        default: 10
      retmode:
        type: string
        default: json
    response:
      format: json
      fields:
      - esearchresult.count
      - esearchresult.idlist
      - esearchresult.querytranslation
    entity: dataset
  getSummary:
    description: Get SRA record summary by ID
    tags:
    - sra-summary
    - sequencing-detail
    method: GET
    path: /esummary.fcgi
    params:
      db:
        type: string
        default: sra
      id:
        type: string
        required: true
        description: SRA ID(s) comma-separated e.g. '3456789'
      retmode:
        type: string
        default: json
    response:
      format: json
    entity: dataset
tests:
  search:
  - name: searches SRA for cancer RNA-seq
    params:
      db: sra
      term: cancer RNA-seq
    assert:
    - path: esearchresult
    - path: esearchresult.idlist
      minLength: 1
