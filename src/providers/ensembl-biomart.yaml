name: ensembl-biomart
displayName: Ensembl BioMart
description: Ensembl BioMart bulk annotation and data retrieval service
tags:
- gene
- annotation
- bulk-query
- ensembl
- biomart
baseUrl: https://www.ensembl.org/biomart/martservice
tools:
  queryBioMart:
    description: Run a BioMart XML query for bulk annotation retrieval (genes, transcripts, variants, etc.)
    tags:
    - bulk-annotation
    - xml-query
    method: GET
    path: /
    params:
      query:
        type: string
        required: true
        description: BioMart XML query string defining dataset, filters, and attributes
    response:
      format: tsv
    entity: gene
  getRegistry:
    description: List available BioMart databases and datasets
    tags:
    - registry
    - datasets
    method: GET
    path: /
    params:
      type:
        type: string
        required: true
        default: registry
        description: Request type — use "registry" to list available marts and datasets
    response:
      format: xml
    entity: dataset
tests:
  getRegistry:
  - name: lists available BioMart databases
    params:
      type: registry
    assert:
    - {}
    allowError: true
  queryBioMart:
  - name: queries for human gene annotations
    params:
      query: <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE Query><Query virtualSchemaName="default" formatter="TSV" header="1"
        uniqueRows="1" count="" datasetConfigVersion="0.6"><Dataset name="hsapiens_gene_ensembl" interface="default"><Filter
        name="hgnc_symbol" value="TP53"/><Attribute name="ensembl_gene_id"/><Attribute name="hgnc_symbol"/><Attribute name="chromosome_name"/></Dataset></Query>
    assert:
    - {}
    allowError: true
