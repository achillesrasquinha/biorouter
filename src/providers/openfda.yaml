name: openfda
displayName: openFDA
description: Open-access FDA data on drugs, devices, and foods including adverse events
tags:
  - drugs
  - fda
  - adverse-events
  - drug-labels
  - pharmacovigilance
baseUrl: https://api.fda.gov
tools:
  searchDrugs:
    description: Search FDA drug labeling data by drug name or active ingredient
    tags:
      - drug-search
      - drug-labels
    method: GET
    path: /drug/label.json
    params:
      query:
        type: string
        required: true
        mapsTo: search
        description: Search query (e.g. "aspirin" or "openfda.brand_name:aspirin")
      limit:
        type: integer
        default: 5
        mapsTo: limit
        description: Maximum number of results (1-100)
    response:
      format: json
      fields:
        - results[].openfda.brand_name
        - results[].openfda.generic_name
        - results[].openfda.route
        - results[].openfda.substance_name
        - results[].indications_and_usage
  searchEvents:
    description: Search FDA adverse event reports for drugs
    tags:
      - adverse-events
      - drug-safety
    method: GET
    path: /drug/event.json
    params:
      query:
        type: string
        required: true
        mapsTo: search
        description: Search query (e.g. "patient.drug.openfda.brand_name:aspirin")
      limit:
        type: integer
        default: 5
        mapsTo: limit
        description: Maximum number of results (1-100)
    response:
      format: json
      fields:
        - results[].patient.drug[].medicinalproduct
        - results[].patient.reaction[].reactionmeddrapt
        - results[].serious
        - results[].receivedate
  searchRecalls:
    description: Search FDA drug recall and enforcement data
    tags:
      - drug-recalls
      - enforcement
    method: GET
    path: /drug/enforcement.json
    params:
      query:
        type: string
        required: true
        mapsTo: search
        description: Search query (e.g. "openfda.brand_name:aspirin")
      limit:
        type: integer
        default: 10
        mapsTo: limit
        description: Maximum number of results (1-100)
    response:
      format: json
      fields:
        - results[].product_description
        - results[].reason_for_recall
        - results[].classification
        - results[].recall_initiation_date
tests:
  searchDrugs:
    - name: searches drug labels for aspirin
      params:
        query: aspirin
        limit: 5
      assert:
        - path: results
          minLength: 1
  searchEvents:
    - name: searches adverse events for aspirin
      params:
        query: aspirin
        limit: 5
      assert:
        - path: results
          minLength: 1
  searchRecalls:
    - name: searches drug recalls
      params:
        query: aspirin
        limit: 5
      assert:
        - path: results
          minLength: 1
