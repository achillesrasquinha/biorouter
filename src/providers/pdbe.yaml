name: pdbe
displayName: PDBe
description: Protein Data Bank in Europe — macromolecular structure data
tags:
  - protein-structure
  - 3d-structure
  - crystallography
  - pdbe
baseUrl: https://www.ebi.ac.uk/pdbe/api
tools:
  getSummary:
    description: Get PDB entry summary by PDB ID
    tags:
      - structure-summary
      - entry-info
    method: GET
    path: /pdb/entry/summary/{pdbId}
    params:
      pdbId:
        type: string
        required: true
        description: PDB entry ID in lowercase (e.g. 1cbs, 4hhb)
    response:
      format: json
      fields:
        - '*.0.title'
        - '*.0.experimental_method'
        - '*.0.deposition_date'
        - '*.0.release_date'
        - '*.0.entry_authors'
        - '*.0.number_of_entities'
        - '*.0.assemblies'
  getMolecules:
    description: Get molecule information for a PDB entry
    tags:
      - molecule-info
      - chain-info
    method: GET
    path: /pdb/entry/molecules/{pdbId}
    params:
      pdbId:
        type: string
        required: true
        description: PDB entry ID in lowercase (e.g. 1cbs, 4hhb)
    response:
      format: json
      fields:
        - '*.0.molecule_name'
        - '*.0.molecule_type'
        - '*.0.entity_id'
        - '*.0.gene_name'
        - '*.0.length'
        - '*.0.weight'
        - '*.0.source[].organism_scientific_name'
        - '*.0.source[].tax_id'
  getLigands:
    description: Get ligand monomers for a PDB entry
    tags:
      - ligand-info
      - small-molecule
    method: GET
    path: /pdb/entry/ligand_monomers/{pdbId}
    params:
      pdbId:
        type: string
        required: true
        description: PDB entry ID in lowercase (e.g. 1cbs, 4hhb)
    response:
      format: json
      fields:
        - '*.0.chem_comp_id'
        - '*.0.chem_comp_name'
  getSecondaryStructure:
    description: Get secondary structure information for a PDB entry
    tags:
      - secondary-structure
      - helix-strand
    method: GET
    path: /pdb/entry/secondary_structure/{pdbId}
    params:
      pdbId:
        type: string
        required: true
        description: PDB entry ID in lowercase (e.g. 1cbs, 4hhb)
    response:
      format: json
      fields:
        - '*.molecules[].chains[].secondary_structure.helices'
        - '*.molecules[].chains[].secondary_structure.strands'
  getPublications:
    description: Get publications associated with a PDB entry
    tags:
      - publication-info
      - literature
    method: GET
    path: /pdb/entry/publications/{pdbId}
    params:
      pdbId:
        type: string
        required: true
        description: PDB entry ID in lowercase (e.g. 1cbs, 4hhb)
    response:
      format: json
      fields:
        - '*.0.title'
        - '*.0.journal_info.pdb_abbreviation'
        - '*.0.pubmed_id'
tests:
  getSummary:
    - name: gets summary for PDB entry 1cbs
      params:
        pdbId: 1cbs
      assert:
        - path: 1cbs
        - path: 1cbs.0.title
  getMolecules:
    - name: gets molecules for PDB entry 1cbs
      params:
        pdbId: 1cbs
      assert:
        - path: 1cbs
        - path: 1cbs.0.molecule_name
  getLigands:
    - name: gets ligands for PDB entry 1cbs
      params:
        pdbId: 1cbs
      assert:
        - path: 1cbs
  getSecondaryStructure:
    - name: gets secondary structure for PDB entry 1cbs
      params:
        pdbId: 1cbs
      assert:
        - path: 1cbs
  getPublications:
    - name: gets publications for PDB entry 1cbs
      params:
        pdbId: 1cbs
      assert:
        - path: 1cbs
        - path: 1cbs.0.title
