name: pharmvar
displayName: PharmVar
description: PharmVar — Pharmacogene Variation Consortium database of pharmacogenomic variant alleles
tags:
  - pharmacogenomics
  - variant
  - allele
  - pharmvar
  - cyp
baseUrl: https://www.pharmvar.org/api-service
auth:
  type: apiKey
  envVar: PHARMVAR_API_KEY
  header: Authorization
tools:
  getAlleles:
    description: Get alleles for a pharmacogene (e.g. CYP2D6, CYP2C19)
    tags:
      - allele-list
      - pharmacogene
    method: GET
    path: /alleles
    params:
      gene:
        type: string
        required: true
        description: Gene name (e.g. CYP2D6, CYP2C19, CYP3A4)
    response:
      format: json
  getGenes:
    description: List all pharmacogenes tracked by PharmVar
    tags:
      - gene-list
      - pharmacogene
    method: GET
    path: /genes
    params: {}
    response:
      format: json
tests:
  getGenes:
    - name: lists pharmacogenes
      params: {}
      assert: []
      allowError: true
