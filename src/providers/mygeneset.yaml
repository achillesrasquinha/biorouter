name: mygeneset
displayName: MyGeneset.info
description: MyGeneset.info — gene set query service for curated and community gene sets
tags:
- gene-set
- pathway
- gene-list
- biothings
baseUrl: https://mygeneset.info/v1
tools:
  queryGenesets:
    description: Search for gene sets by gene name, pathway, or keyword
    tags:
    - gene-set-search
    - pathway-search
    method: GET
    path: /query
    params:
      q:
        type: string
        required: true
        description: Search query (e.g. BRCA1, apoptosis, KEGG cancer)
      size:
        type: integer
        default: 10
        description: Number of results
    response:
      format: json
      fields:
      - total
      - hits[].name
      - hits[].description
      - hits[].genes[].symbol
    entity: gene
  getGeneset:
    description: Get details for a specific gene set by ID
    tags:
    - gene-set-info
    method: GET
    path: /geneset/{genesetId}
    params:
      genesetId:
        type: string
        required: true
        description: Gene set ID (e.g. MORF_BRCA1, GO_0006915)
    response:
      format: json
      fields:
      - name
      - description
      - genes[].symbol
      - genes[].name
    entity: gene
tests:
  queryGenesets:
  - name: searches for BRCA1 gene sets
    params:
      q: BRCA1
      size: 2
    assert:
    - path: total
    - path: hits
      minLength: 1
