name: dbvar
displayName: dbVar
description: NCBI dbVar — database of genomic structural variants (CNVs, insertions, deletions, inversions)
tags:
- structural-variants
- cnv
- genomics
- ncbi
- copy-number
baseUrl: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
tools:
  search:
    description: Search dbVar for structural variants by query term
    tags:
    - variant-search
    - structural-variant-search
    method: GET
    path: /esearch.fcgi
    params:
      term:
        type: string
        required: true
        description: Search query (e.g. "BRCA1", "chr17 deletion", "nsv530705")
      db:
        type: string
        default: dbvar
        description: NCBI database
      retmode:
        type: string
        default: json
        description: Return mode
      retmax:
        type: integer
        default: 10
        description: Maximum number of results to return
    response:
      format: json
      fields:
      - esearchresult.count
      - esearchresult.retmax
      - esearchresult.idlist
      - esearchresult.querytranslation
    entity: variant
  getSummary:
    description: Get summary information for dbVar structural variants by ID
    tags:
    - variant-summary
    - variant-detail
    method: GET
    path: /esummary.fcgi
    params:
      id:
        type: string
        required: true
        description: dbVar variant ID or comma-separated IDs
      db:
        type: string
        default: dbvar
        description: NCBI database
      retmode:
        type: string
        default: json
        description: Return mode
    response:
      format: json
    entity: variant
tests:
  search:
  - name: searches for BRCA1 structural variants
    params:
      term: BRCA1
    assert:
    - {}
    allowError: true
  getSummary:
  - name: gets variant summary by ID
    params:
      id: nsv530705
    assert:
    - {}
    allowError: true
