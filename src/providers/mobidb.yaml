name: mobidb
displayName: MobiDB
description: Protein disorder and mobility annotations
tags:
- disorder
- protein
- mobility
- annotation
- mobidb
baseUrl: https://mobidb.org/api
tools:
  getEntry:
    description: Get disorder annotations for a protein by UniProt accession
    tags:
    - disorder-annotation
    - protein-mobility
    method: GET
    path: /download
    params:
      acc:
        type: string
        required: true
        description: UniProt accession e.g. 'P04637'
      format:
        type: string
        default: json
    response:
      format: json
      fields:
      - acc
      - gene
      - name
      - organism
      - length
      - ncbi_taxon_id
      - sequence
    entity: protein
tests:
  getEntry:
  - name: gets disorder annotations for P04637 (TP53)
    params:
      acc: P04637
    assert:
    - {}
    - anyOf:
      - acc
      - gene
