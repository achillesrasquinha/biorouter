name: aquamaps
displayName: AquaMaps
description: AquaMaps — predicted species distribution maps for marine and freshwater organisms
tags:
- marine
- aquatic
- species-distribution
- ecology
- biodiversity
- freshwater
baseUrl: https://aquamaps.org/webservice
tools:
  searchSpecies:
    description: Search AquaMaps for aquatic species by name
    tags:
    - species-search
    - aquatic-search
    method: GET
    path: /api/species
    params:
      q:
        type: string
        required: true
        description: Species name to search (e.g. "Thunnus thynnus", "shark")
    response:
      format: json
    entity: organism
  getDistribution:
    description: Get predicted distribution map data for a species
    tags:
    - distribution-map
    - species-range
    method: GET
    path: /api/distribution/{speciesId}
    params:
      speciesId:
        type: string
        required: true
        description: AquaMaps species identifier
    response:
      format: json
    entity: organism
tests:
  searchSpecies:
  - name: searches for bluefin tuna
    params:
      q: Thunnus thynnus
    assert:
    - minLength: 1
    allowError: true
