name: itasser
displayName: I-TASSER
description: I-TASSER — protein structure and function prediction server (Zhang Lab)
tags:
- protein-structure
- prediction
- homology-modeling
- itasser
baseUrl: https://zhanggroup.org/I-TASSER
tools:
  submitPrediction:
    description: Submit a protein sequence for structure prediction (async job)
    tags:
    - structure-prediction
    - job-submission
    method: POST
    path: /submit
    params:
      sequence:
        type: string
        required: true
        description: Amino acid sequence (single-letter code, no FASTA header)
      email:
        type: string
        required: true
        description: Email address for job notification
    response:
      format: json
    entity: structure
  getPredictionResults:
    description: Get results of an I-TASSER structure prediction job
    tags:
    - structure-results
    - job-results
    method: GET
    path: /results/{jobId}
    params:
      jobId:
        type: string
        required: true
        description: Job ID returned from the submit endpoint
    response:
      format: json
    entity: structure
tests:
  submitPrediction:
  - name: submits a sequence for structure prediction
    params:
      sequence: MVLSPADKTNVKAAWGKVGAHAGEYGAEALERMFLSFPTTKTYFPHFDLSH
      email: test@example.com
    assert:
    - path: jobId
    allowError: true
  getPredictionResults:
  - name: gets results for a prediction job
    params:
      jobId: test123
    assert:
    - path: status
    allowError: true
