name: obis
displayName: OBIS
description: Ocean Biodiversity Information System — marine species occurrence and distribution data
tags:
- marine
- ocean
- biodiversity
- obis
- species-distribution
baseUrl: https://api.obis.org/v3
tools:
  searchOccurrences:
    description: Search OBIS for marine species occurrence records by scientific name
    tags:
    - occurrence-search
    - marine-distribution
    method: GET
    path: /occurrence
    params:
      name:
        type: string
        required: true
        mapsTo: scientificname
        description: Scientific name of the species (e.g. "Carcharodon carcharias")
      size:
        type: integer
        default: 10
        description: Number of results to return
    response:
      format: json
      fields:
      - total
      - results[].scientificName
      - results[].species
      - results[].taxonID
      - results[].decimalLatitude
      - results[].decimalLongitude
      - results[].eventDate
      - results[].country
      - results[].depth
    entity: organism
  searchTaxa:
    description: Search OBIS checklist for marine taxa by scientific name
    tags:
    - taxon-search
    - marine-taxonomy
    method: GET
    path: /checklist
    params:
      name:
        type: string
        required: true
        mapsTo: scientificname
        description: Scientific name to search (e.g. "Carcharodon carcharias")
    response:
      format: json
      fields:
      - total
      - results[].scientificName
      - results[].taxonID
      - results[].taxonRank
      - results[].taxonomicStatus
      - results[].kingdom
      - results[].phylum
      - results[].class
      - results[].order
      - results[].family
      - results[].genus
      - results[].records
    entity: organism
  getTaxon:
    description: Get OBIS taxon details by AphiaID
    tags:
    - taxon-info
    - marine-record
    method: GET
    path: /taxon/{taxonId}
    params:
      taxonId:
        type: integer
        required: true
        description: WoRMS AphiaID of the taxon
    response:
      format: json
      fields:
      - total
      - results[].scientificName
      - results[].taxonID
      - results[].taxonRank
      - results[].taxonomicStatus
      - results[].category
      - results[].family
      - results[].order
      - results[].vernacularNames
    entity: organism
tests:
  searchOccurrences:
  - name: searches occurrences for Carcharodon carcharias
    params:
      name: Carcharodon carcharias
    assert:
    - path: results
      minLength: 1
  searchTaxa:
  - name: searches checklist for Carcharodon carcharias
    params:
      name: Carcharodon carcharias
    assert:
    - path: results
      minLength: 1
    - path: results.0.taxonID
  getTaxon:
  - name: gets taxon by AphiaID 105838
    params:
      taxonId: 105838
    assert:
    - path: results
      minLength: 1
    - path: results.0.scientificName
      equals: Carcharodon carcharias
