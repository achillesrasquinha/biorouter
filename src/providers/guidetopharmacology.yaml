name: guidetopharmacology
displayName: Guide to Pharmacology
description: IUPHAR/BPS Guide to Pharmacology database of drug targets and ligands
tags:
- pharmacology
- drug-targets
- ligands
- receptors
- iuphar
baseUrl: https://www.guidetopharmacology.org/services
tools:
  searchTargets:
    description: Search pharmacological targets by name
    tags:
    - target-search
    - receptor-search
    method: GET
    path: /targets
    params:
      name:
        type: string
        required: true
        mapsTo: name
        description: Target name to search for (e.g. EGFR, dopamine)
    response:
      format: json
      fields:
      - '[].targetId'
      - '[].name'
      - '[].abbreviation'
      - '[].type'
      - '[].familyNames'
    entity: protein
  searchLigands:
    description: Search pharmacological ligands by name
    tags:
    - ligand-search
    - drug-search
    method: GET
    path: /ligands
    params:
      name:
        type: string
        required: true
        mapsTo: name
        description: Ligand name to search for (e.g. erlotinib, morphine)
    response:
      format: json
      fields:
      - '[].ligandId'
      - '[].name'
      - '[].type'
      - '[].inn'
      - '[].approved'
      - '[].approvalSource'
    entity: compound
  getLigand:
    description: Get ligand details by ligand ID
    tags:
    - ligand-info
    - drug-detail
    method: GET
    path: /ligands/{ligandId}
    params:
      ligandId:
        type: integer
        required: true
        description: Ligand ID (e.g. 5085)
    response:
      format: json
      fields:
      - ligandId
      - name
      - type
      - approved
      - inn
    entity: compound
  getTarget:
    description: Get target details by target ID
    tags:
    - target-info
    - receptor-detail
    method: GET
    path: /targets/{targetId}
    params:
      targetId:
        type: integer
        required: true
        description: Target ID (e.g. 1)
    response:
      format: json
      fields:
      - targetId
      - name
      - nomenclature
      - type
      - familyIds
    entity: protein
tests:
  searchTargets:
  - name: searches targets for EGFR
    params:
      name: EGFR
    assert:
    - {}
    - anyOf:
      - isArray: true
        minLength: 1
      - path: targets
  searchLigands:
  - name: searches ligands for erlotinib
    params:
      name: erlotinib
    assert:
    - {}
    - anyOf:
      - isArray: true
        minLength: 1
      - path: ligands
  getLigand:
  - name: gets ligand details for ligand 5085
    params:
      ligandId: 5085
    assert:
    - path: ligandId
    - path: name
  getTarget:
  - name: gets target details for target 1
    params:
      targetId: 1
    assert:
    - path: targetId
    - path: name
