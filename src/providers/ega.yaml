name: ega
displayName: European Genome-phenome Archive
description: EGA metadata API for controlled-access genomic and phenomic datasets
tags:
- genomics
- phenomics
- archive
- controlled-access
- ega
baseUrl: https://ega-archive.org/metadata/v2
tools:
  searchDatasets:
    description: Search EGA datasets by keyword or list recent datasets
    tags:
    - dataset-search
    - ega-search
    method: GET
    path: /datasets
    params:
      limit:
        type: integer
        default: 10
        description: Maximum number of datasets to return
      skip:
        type: integer
        default: 0
        description: Number of datasets to skip (for pagination)
    response:
      format: json
    entity: dataset
  getDataset:
    description: Get metadata for a specific EGA dataset by accession ID
    tags:
    - dataset-info
    - ega-detail
    method: GET
    path: /datasets/{id}
    params:
      id:
        type: string
        required: true
        description: EGA dataset accession (e.g. EGAD00001000001)
    response:
      format: json
    entity: dataset
  searchStudies:
    description: Search EGA studies or list recent studies
    tags:
    - study-search
    - ega-studies
    method: GET
    path: /studies
    params:
      limit:
        type: integer
        default: 10
        description: Maximum number of studies to return
      skip:
        type: integer
        default: 0
        description: Number of studies to skip (for pagination)
    response:
      format: json
    entity: dataset
tests:
  searchDatasets:
  - name: lists EGA datasets
    params:
      limit: 5
    assert:
    - minLength: 1
    allowError: true
  getDataset:
  - name: gets a specific EGA dataset
    params:
      id: EGAD00001000001
    assert:
    - minLength: 1
    allowError: true
  searchStudies:
  - name: lists EGA studies
    params:
      limit: 5
    assert:
    - minLength: 1
    allowError: true
