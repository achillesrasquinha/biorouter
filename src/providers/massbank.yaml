name: massbank
displayName: MassBank
description: Public repository of mass spectra for metabolite identification
tags:
- mass-spectrometry
- metabolites
- spectra
- metabolomics
- chemistry
# NOTE: MassBank has migrated to MassBank 3, a single-page application.
# The old REST API endpoints now return HTML instead of JSON.
# Tests will fail until the new API endpoints are identified.
baseUrl: https://massbank.eu/MassBank/api
tools:
  search:
    description: Search MassBank mass spectra records by compound name
    tags:
    - spectra-search
    - compound-search
    method: GET
    path: /records
    params:
      compound:
        type: string
        required: true
        mapsTo: compound
        description: Compound name to search for (e.g. caffeine, glucose)
      limit:
        type: integer
        default: 10
        mapsTo: limit
        description: Maximum number of records to return
    response:
      format: json
      fields:
      - '[].accession'
      - '[].title'
      - '[].compound.names'
      - '[].compound.formula'
      - '[].compound.mass'
      - '[].compound.classes'
      - '[].acquisition.instrument_type'
      - '[].acquisition.mass_spectrometry.ms_type'
      - '[].acquisition.mass_spectrometry.ion_mode'
    entity: compound
  getSpectrum:
    description: Get a specific MassBank record by accession number
    tags:
    - spectra-info
    - record-info
    method: GET
    path: /records/{accession}
    params:
      accession:
        type: string
        required: true
        description: MassBank accession number (e.g. EA000101)
    response:
      format: json
      fields:
      - accession
      - title
      - compound.names
      - compound.formula
      - compound.mass
      - compound.classes
      - compound.inchi
      - compound.smiles
      - acquisition.instrument_type
      - peak
    entity: compound
tests:
  search:
  - name: searches records for caffeine
    params:
      compound: caffeine
      limit: 10
    assert:
    - {}
    allowError: true
  getSpectrum:
  - name: gets a specific record by accession
    params:
      accession: EA000101
    assert:
    - {}
    allowError: true
