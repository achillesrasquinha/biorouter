name: rnacentral
displayName: RNAcentral
description: RNAcentral — comprehensive non-coding RNA sequence database
tags:
- rna
- noncoding-rna
- sequences
- rnacentral
baseUrl: https://rnacentral.org/api/v1
tools:
  search:
    description: Search RNAcentral for non-coding RNA sequences by keyword
    tags:
    - rna-search
    - sequence-search
    method: GET
    path: /rna/
    params:
      query:
        type: string
        required: true
        description: Search query (e.g. BRCA1, mir-21, human ribosomal)
      page_size:
        type: integer
        default: 10
        description: Number of results per page
      format:
        type: string
        default: json
        description: Response format
    response:
      format: json
      fields:
      - results[].rnacentral_id
      - results[].description
      - results[].rna_type
      - results[].length
      - results[].count_distinct_organisms
      - results[].distinct_databases
    entity: sequence
  getEntry:
    description: Get a specific RNA entry by its URS identifier
    tags:
    - rna-info
    - sequence-info
    method: GET
    path: /rna/{upi}
    params:
      upi:
        type: string
        required: true
        description: URS identifier (e.g. URS0000301B08)
      format:
        type: string
        default: json
        description: Response format
    response:
      format: json
      fields:
      - rnacentral_id
      - description
      - rna_type
      - sequence
      - length
      - is_active
      - count_distinct_organisms
      - distinct_databases
    entity: dataset
tests:
  search:
  - name: searches for BRCA1 non-coding RNA
    params:
      query: BRCA1
      page_size: 5
    assert:
    - path: results
      minLength: 1
    - path: results.0.rnacentral_id
  getEntry:
  - name: gets a specific RNA entry by URS identifier
    params:
      upi: URS0000301B08
    assert:
    - path: rnacentral_id
      equals: URS0000301B08
    - path: sequence
