name: hgnc
displayName: HGNC
description: HUGO Gene Nomenclature Committee — approved human gene symbols and names
tags:
- gene
- nomenclature
- symbol
- human
- hgnc
baseUrl: https://rest.genenames.org
headers:
  Accept: application/json
tools:
  search:
    description: Search HGNC for gene symbols and names
    tags:
    - gene-search
    - symbol-search
    method: GET
    path: /search/{query}
    params:
      query:
        type: string
        required: true
        description: Search query (e.g. "BRCA1", "kinase")
    response:
      format: json
      fields:
      - response.docs[].symbol
      - response.docs[].hgnc_id
      - response.docs[].score
    entity: gene
  getGene:
    description: Get gene record by approved gene symbol
    tags:
    - gene-info
    - symbol-lookup
    method: GET
    path: /fetch/symbol/{symbol}
    params:
      symbol:
        type: string
        required: true
        description: Approved gene symbol (e.g. "BRCA1", "TP53")
    response:
      format: json
      fields:
      - response.docs[].hgnc_id
      - response.docs[].symbol
      - response.docs[].name
      - response.docs[].locus_group
      - response.docs[].locus_type
      - response.docs[].location
      - response.docs[].alias_symbol
      - response.docs[].entrez_id
    entity: gene
  getGeneById:
    description: Get gene record by HGNC ID
    tags:
    - gene-info
    - hgnc-id-lookup
    method: GET
    path: /fetch/hgnc_id/{hgncId}
    params:
      hgncId:
        type: string
        required: true
        description: HGNC identifier (e.g. "HGNC:11998" for TP53)
    response:
      format: json
      fields:
      - response.docs[].hgnc_id
      - response.docs[].symbol
      - response.docs[].name
      - response.docs[].alias_symbol
      - response.docs[].locus_type
      - response.docs[].gene_group
    entity: gene
  getGeneByEntrezId:
    description: Fetch gene record by Entrez/NCBI gene ID
    tags:
    - gene-info
    - entrez-lookup
    method: GET
    path: /fetch/entrez_id/{entrezId}
    params:
      entrezId:
        type: string
        required: true
        description: Entrez gene ID (e.g. 672 for BRCA1)
    response:
      format: json
      fields:
      - response.docs[].hgnc_id
      - response.docs[].symbol
      - response.docs[].name
      - response.docs[].entrez_id
    entity: gene
  getGeneByEnsemblId:
    description: Fetch gene record by Ensembl gene ID
    tags:
    - gene-info
    - ensembl-lookup
    method: GET
    path: /fetch/ensembl_gene_id/{ensemblId}
    params:
      ensemblId:
        type: string
        required: true
        description: Ensembl gene ID (e.g. ENSG00000012048)
    response:
      format: json
      fields:
      - response.docs[].hgnc_id
      - response.docs[].symbol
      - response.docs[].name
      - response.docs[].ensembl_gene_id
    entity: gene
tests:
  search:
  - name: searches for BRCA1 gene
    params:
      query: BRCA1
    assert:
    - path: response.docs
      minLength: 1
  getGene:
  - name: gets gene record for BRCA1 symbol
    params:
      symbol: BRCA1
    assert:
    - path: response.docs
      minLength: 1
    - path: response.docs.0.symbol
      equals: BRCA1
  getGeneById:
  - name: gets gene record by HGNC ID for TP53
    params:
      hgncId: HGNC:11998
    assert:
    - path: response.docs
      minLength: 1
    - path: response.docs.0.symbol
      equals: TP53
  getGeneByEntrezId:
  - name: gets gene by Entrez ID for BRCA1
    params:
      entrezId: '672'
    assert:
    - path: response.docs
      minLength: 1
    - path: response.docs.0.symbol
      equals: BRCA1
  getGeneByEnsemblId:
  - name: gets gene by Ensembl ID for BRCA1
    params:
      ensemblId: ENSG00000012048
    assert:
    - path: response.docs
      minLength: 1
    - path: response.docs.0.symbol
      equals: BRCA1
