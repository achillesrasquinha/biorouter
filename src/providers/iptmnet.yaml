name: iptmnet
displayName: iPTMnet
description: iPTMnet — post-translational modification (PTM) knowledge base for proteins
tags:
- ptm
- post-translational-modification
- phosphorylation
- proteomics
- iptmnet
baseUrl: https://research.bioinformatics.udel.edu/iptmnet/api
tools:
  search:
    description: Search iPTMnet for proteins with post-translational modifications
    tags:
    - ptm-search
    - protein-search
    method: GET
    path: /search
    params:
      search_term:
        type: string
        required: true
        mapsTo: search_term
        description: Search term — protein name, gene symbol, or UniProt ID (e.g. "EGFR", "P00533")
      role:
        type: string
        default: ''
        description: Role filter (e.g. Enzyme, Substrate, EnzymeOrSubstrate)
    response:
      format: json
    entity: protein
  getEntry:
    description: Get PTM details for a specific protein entry
    tags:
    - ptm-info
    - protein-info
    method: GET
    path: /{id}
    params:
      id:
        type: string
        required: true
        description: UniProt accession (e.g. P00533 for EGFR)
    response:
      format: json
    entity: protein
  getSubstrates:
    description: Get known substrates for an enzyme
    tags:
    - substrate-info
    - enzyme-substrates
    method: GET
    path: /substrate/{id}
    params:
      id:
        type: string
        required: true
        description: UniProt accession of the enzyme (e.g. P00533)
    response:
      format: json
    entity: protein
tests:
  search:
  - name: searches for EGFR post-translational modifications
    params:
      search_term: EGFR
    assert:
    - isArray: true
    allowError: true
  getEntry:
  - name: gets PTM entry for P00533
    params:
      id: P00533
    assert:
    - path: uniprot_ac
    allowError: true
  getSubstrates:
  - name: gets substrates for P00533
    params:
      id: P00533
    assert:
    - isArray: true
    allowError: true
