name: pathway-commons
displayName: Pathway Commons
description: Integrated biological pathway and interaction data from multiple sources
tags:
- pathway
- interaction
- signaling
- metabolism
- pathway-commons
baseUrl: https://www.pathwaycommons.org/pc2
tools:
  search:
    description: Search pathways and interactions
    tags:
    - pathway-search
    - interaction-search
    method: GET
    path: /search
    params:
      q:
        type: string
        required: true
        description: Search query e.g. 'BRCA1'
      type:
        type: string
        default: Pathway
        description: BioPAX type filter
      datasource:
        type: string
        description: Filter by source e.g. 'reactome'
    response:
      format: json
      fields:
      - numHits
      - searchHit[].uri
      - searchHit[].name
      - searchHit[].biopaxClass
      - searchHit[].dataSource
      - searchHit[].numParticipants
      - searchHit[].numProcesses
      - searchHit[].pathway
    entity: pathway
  getEntity:
    description: Get entity details by URI
    tags:
    - entity-detail
    - biopax
    method: GET
    path: /get
    params:
      uri:
        type: string
        required: true
        description: BioPAX URI of the entity
      format:
        type: string
        default: json
        description: Response format
    response:
      format: json
      fields:
      - '@id'
      - '@type'
      - name
      - dataSource
      - displayName
      - comment
    entity: pathway
  graph:
    description: Get interaction neighborhood graph
    tags:
    - graph-query
    - neighborhood
    method: GET
    path: /graph
    params:
      source:
        type: string
        required: true
        description: Gene symbol or URI
      kind:
        type: string
        default: neighborhood
        description: Graph query type
      format:
        type: string
        default: EXTENDED_BINARY_SIF
        description: Output format
    response:
      format: json
      fields:
      - '[].PARTICIPANT_A'
      - '[].INTERACTION_TYPE'
      - '[].PARTICIPANT_B'
      - '[].INTERACTION_DATA_SOURCE'
      - '[].INTERACTION_PUBMED_ID'
    entity: pathway
tests:
  search:
  - name: searches for BRCA1 pathways
    params:
      q: BRCA1
      type: Pathway
    assert:
    - {}
    - path: searchHit
    allowError: true
