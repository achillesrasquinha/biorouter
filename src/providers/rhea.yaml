name: rhea
displayName: Rhea
description: Expert-curated knowledgebase of biochemical reactions
tags:
- reaction
- biochemistry
- enzyme
- metabolism
- rhea
baseUrl: https://www.rhea-db.org/rhea
tools:
  search:
    description: Search Rhea for biochemical reactions by keyword
    tags:
    - reaction-search
    - biochemistry-search
    method: GET
    path: /
    params:
      query:
        type: string
        required: true
        mapsTo: query
        description: Search keyword (e.g. "ATP", "glucose")
      format:
        type: string
        default: json
      columns:
        type: string
        default: rhea-id,equation
        description: Columns to return
    response:
      format: json
      fields:
      - count
      - results[].id
      - results[].equation
      - results[].status
      - results[].balanced
      - results[].transport
    entity: compound
  getReaction:
    description: Get a specific Rhea reaction by ID
    tags:
    - reaction-info
    - reaction-lookup
    method: GET
    path: /
    params:
      rheaId:
        type: string
        required: true
        mapsTo: query
        description: Rhea reaction ID (e.g. "RHEA:10000")
      format:
        type: string
        default: json
    response:
      format: json
      fields:
      - count
      - results[].id
      - results[].equation
      - results[].status
      - results[].balanced
      - results[].transport
    entity: reaction
tests:
  search:
  - name: searches for ATP reactions
    params:
      query: ATP
    assert:
    - path: count
      gt: 0
    - path: results
      minLength: 1
    - path: results.0.equation
  getReaction:
  - name: gets reaction RHEA:10000
    params:
      rheaId: RHEA:10000
    assert:
    - path: count
      gte: 1
    - path: results.0.equation
