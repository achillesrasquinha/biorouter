name: gwas-catalog
displayName: GWAS Catalog
description: NHGRI-EBI Catalog of genome-wide association studies
tags:
- gwas
- genetic-associations
- snp
- disease-traits
- ebi
baseUrl: https://www.ebi.ac.uk/gwas/rest/api
tools:
  search:
    description: Search GWAS Catalog studies by disease trait name
    tags:
    - gwas-search
    - association-search
    method: GET
    path: /studies/search/findByDiseaseTrait
    params:
      query:
        type: string
        required: true
        mapsTo: diseaseTrait
        description: Disease trait name (e.g. "diabetes", "asthma")
      page:
        type: integer
        default: 0
        description: Page number (zero-based)
      size:
        type: integer
        default: 5
        description: Number of results per page
    response:
      format: json
      fields:
      - _embedded.studies[].accessionId
      - _embedded.studies[].diseaseTrait.trait
      - _embedded.studies[].initialSampleSize
      - _embedded.studies[].snpCount
      - _embedded.studies[].publicationInfo.pubmedId
      - _embedded.studies[].publicationInfo.title
      - _embedded.studies[].publicationInfo.publication
      - _embedded.studies[].publicationInfo.author.fullname
    entity: disease
  getStudy:
    description: Get GWAS study details by study accession ID
    tags:
    - study-info
    - gwas-study
    method: GET
    path: /studies/{studyId}
    params:
      studyId:
        type: string
        required: true
        description: GWAS study accession (e.g. "GCST90038633")
    response:
      format: json
      fields:
      - accessionId
      - diseaseTrait.trait
      - initialSampleSize
      - replicationSampleSize
      - snpCount
      - publicationInfo.pubmedId
      - publicationInfo.title
      - publicationInfo.publication
      - publicationInfo.author.fullname
      - genotypingTechnologies[].genotypingTechnology
    entity: dataset
  getAssociations:
    description: Get SNP-trait associations for a GWAS study
    tags:
    - associations
    - snp-trait
    method: GET
    path: /studies/{studyId}/associations
    params:
      studyId:
        type: string
        required: true
        description: GWAS study accession (e.g. GCST90038633)
    response:
      format: json
      fields:
      - _embedded.associations[].snpInteraction
      - _embedded.associations[].pvalue
      - _embedded.associations[].orPerCopyNum
      - _embedded.associations[].betaNum
    entity: dataset
  searchByPubmed:
    description: Find GWAS studies by PubMed ID
    tags:
    - pubmed
    - study-search
    method: GET
    path: /studies/search/findByPublicationIdPubmedId
    params:
      pubmedId:
        type: string
        required: true
        description: PubMed ID (e.g. 25673413)
      page:
        type: integer
        default: 0
        description: Page number (zero-based)
    response:
      format: json
      fields:
      - _embedded.studies[].accessionId
      - _embedded.studies[].diseaseTrait.trait
    entity: publication
  getSingleNucleotidePolymorphism:
    description: Get SNP details by rsId
    tags:
    - snp
    - variant
    method: GET
    path: /singleNucleotidePolymorphisms/{rsId}
    params:
      rsId:
        type: string
        required: true
        description: SNP rsId (e.g. rs7412)
    response:
      format: json
      fields:
      - rsId
      - merged
      - functionalClass
      - locations[].chromosomeName
      - locations[].chromosomePosition
    entity: sequence
  getAssociationsByEfoTrait:
    description: Get associations for an EFO trait
    tags:
    - efo
    - associations
    method: GET
    path: /efoTraits/{efoId}/associations
    params:
      efoId:
        type: string
        required: true
        description: EFO trait ID (e.g. EFO_0000270)
      page:
        type: integer
        default: 0
        description: Page number (zero-based)
      size:
        type: integer
        default: 10
        description: Number of results per page
    response:
      format: json
      fields:
      - _embedded.associations[].pvalue
      - _embedded.associations[].snpInteraction
    entity: dataset
  searchByEfoTrait:
    description: Find GWAS studies by EFO trait URI
    tags:
    - efo-search
    - study-search
    method: GET
    path: /studies/search/findByEfoTrait
    params:
      efoTrait:
        type: string
        required: true
        description: EFO trait name (e.g. diabetes mellitus)
      page:
        type: integer
        default: 0
        description: Page number (zero-based)
      size:
        type: integer
        default: 5
        description: Number of results per page
    response:
      format: json
      fields:
      - _embedded.studies[].accessionId
      - _embedded.studies[].diseaseTrait.trait
      - _embedded.studies[].publicationInfo.title
    entity: disease
  getStudySnps:
    description: Get SNPs associated with a GWAS study
    tags:
    - study-snps
    - summary
    method: GET
    path: /studies/{studyId}/snps
    params:
      studyId:
        type: string
        required: true
        description: GWAS study accession (e.g. GCST90038633)
    response:
      format: json
      fields:
      - _embedded.singleNucleotidePolymorphisms[].rsId
      - _embedded.singleNucleotidePolymorphisms[].functionalClass
    entity: dataset
  listEfoTraits:
    description: Browse available EFO traits
    tags:
    - efo
    - browse
    method: GET
    path: /efoTraits
    params:
      page:
        type: integer
        default: 0
        description: Page number (zero-based)
      size:
        type: integer
        default: 20
        description: Number of results per page
    response:
      format: json
      fields:
      - _embedded.efoTraits[].shortForm
      - _embedded.efoTraits[].trait
    entity: dataset
  getStudyEfoTraits:
    description: Get EFO traits associated with a GWAS study
    tags:
    - efo
    - study-info
    method: GET
    path: /studies/{studyId}/efoTraits
    params:
      studyId:
        type: string
        required: true
        description: GWAS study accession (e.g. GCST90038633)
    response:
      format: json
      fields:
      - _embedded.efoTraits[].shortForm
      - _embedded.efoTraits[].trait
    entity: dataset
tests:
  search:
  - name: searches for diabetes studies by trait
    params:
      query: diabetes
    assert:
    - path: _embedded.studies
      minLength: 1
  getStudy:
  - name: gets a specific GWAS study by accession
    params:
      studyId: GCST90038633
    assert:
    - anyOf:
      - accessionId
      - diseaseTrait
  getAssociations:
  - name: gets associations for a GWAS study
    params:
      studyId: GCST90038633
    assert:
    - path: _embedded.associations
  searchByPubmed:
  - name: finds studies by PubMed ID
    params:
      pubmedId: '25673413'
    assert:
    - path: _embedded.studies
  getSingleNucleotidePolymorphism:
  - name: gets SNP details for rs7412
    params:
      rsId: rs7412
    assert:
    - path: rsId
      equals: rs7412
    - path: functionalClass
  getAssociationsByEfoTrait:
  - name: gets associations for EFO_0000270
    params:
      efoId: EFO_0000270
      page: 0
      size: 5
    assert:
    - path: _embedded.associations
  searchByEfoTrait:
  - name: finds studies for diabetes mellitus EFO trait
    params:
      efoTrait: diabetes mellitus
      page: 0
      size: 5
    assert:
    - path: _embedded.studies
  getStudySnps:
  - name: gets SNPs for a GWAS study
    params:
      studyId: GCST90038633
    assert:
    - path: _embedded.singleNucleotidePolymorphisms
  listEfoTraits:
  - name: lists available EFO traits
    params:
      page: 0
      size: 10
    assert:
    - path: _embedded.efoTraits
  getStudyEfoTraits:
  - name: gets EFO traits for a GWAS study
    params:
      studyId: GCST90038633
    assert:
    - path: _embedded.efoTraits
