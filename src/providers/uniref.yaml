name: uniref
displayName: UniRef
description: UniProt Reference Clusters — clustered sets of related protein sequences
tags:
- protein
- sequence-clusters
- uniref
- uniprot
baseUrl: https://rest.uniprot.org/uniref
tools:
  search:
    description: Search UniRef clusters by keyword
    tags:
    - cluster-search
    - protein-search
    method: GET
    path: /search
    params:
      query:
        type: string
        required: true
        description: Search query (e.g. "insulin", "kinase AND identity:0.9")
      format:
        type: string
        default: json
      size:
        type: integer
        default: 5
        description: Number of results to return
    response:
      format: json
      fields:
      - results[].id
      - results[].name
      - results[].memberCount
      - results[].entryType
      - results[].commonTaxon.scientificName
      - results[].representativeMember.organismName
      - results[].representativeMember.proteinName
    entity: protein
  getCluster:
    description: Get UniRef cluster details by cluster ID
    tags:
    - cluster-info
    - protein-cluster
    method: GET
    path: /{clusterId}
    params:
      clusterId:
        type: string
        required: true
        description: UniRef cluster ID (e.g. UniRef90_P01308 for insulin)
    response:
      format: json
      fields:
      - id
      - name
      - memberCount
      - entryType
      - commonTaxon.scientificName
      - representativeMember.proteinName
      - representativeMember.organismName
      - representativeMember.sequenceLength
    entity: sequence
tests:
  search:
  - name: searches for insulin clusters
    params:
      query: insulin
    assert:
    - path: results
      minLength: 1
    - path: results.0.id
  getCluster:
  - name: gets insulin cluster by ID
    params:
      clusterId: UniRef90_P01308
    assert:
    - path: id
      equals: UniRef90_P01308
    - path: name
