name: usda-nass
displayName: USDA NASS
description: USDA National Agricultural Statistics Service — US crop, livestock, and agricultural census data
tags:
- agriculture
- usda
- statistics
- crops
- livestock
- census
baseUrl: https://quickstats.nass.usda.gov/api
auth:
  type: apiKey
  param: key
  env: LS_USDA_NASS_API_KEY
tools:
  queryStatistics:
    description: Query USDA NASS agricultural statistics by commodity and year
    tags:
    - ag-statistics
    - crop-data
    - livestock-data
    method: GET
    path: /api_GET
    params:
      commodity_desc:
        type: string
        required: true
        description: Commodity name (e.g. "CORN", "WHEAT", "SOYBEANS", "CATTLE")
      year:
        type: string
        description: Year filter (e.g. "2023")
      state_name:
        type: string
        description: State name filter (e.g. "IOWA", "CALIFORNIA")
      statisticcat_desc:
        type: string
        description: Statistic category (e.g. "PRODUCTION", "YIELD", "AREA PLANTED")
    response:
      format: json
    entity: dataset
  getParams:
    description: Get allowed values for a NASS query parameter
    tags:
    - parameter-values
    - data-dictionary
    method: GET
    path: /get_param_values
    params:
      param:
        type: string
        required: true
        description: Parameter name to get values for (e.g. "commodity_desc", "state_name", "year")
    response:
      format: json
    entity: dataset
tests:
  queryStatistics:
  - name: queries corn production statistics
    params:
      commodity_desc: CORN
      year: '2023'
    assert:
    - minLength: 1
    allowError: true
  getParams:
  - name: gets list of commodity values
    params:
      param: commodity_desc
    assert:
    - minLength: 1
    allowError: true
