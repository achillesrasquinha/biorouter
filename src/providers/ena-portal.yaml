name: ena-portal
displayName: ENA Portal
description: ENA Portal API — advanced search across ENA studies, samples, experiments, and assemblies
tags:
- ena
- nucleotide
- sequencing
- studies
- ebi
baseUrl: https://www.ebi.ac.uk/ena/portal/api
tools:
  search:
    description: Search ENA for studies, samples, experiments, or assemblies
    tags:
    - ena-search
    - study-search
    method: GET
    path: /search
    params:
      query:
        type: string
        required: true
        description: Search query (e.g. study_accession="PRJNA100001", tax_eq(9606))
      result:
        type: string
        required: true
        description: Result type (study, sample, experiment, assembly, read_run)
      fields:
        type: string
        description: Comma-separated fields to return
      format:
        type: string
        default: json
        description: Output format (json, tsv)
      limit:
        type: integer
        default: 10
        description: Maximum results
    response:
      format: json
    entity: sample
  returnFields:
    description: List available return fields for a result type
    tags:
    - metadata
    - fields
    method: GET
    path: /returnFields
    params:
      result:
        type: string
        required: true
        description: Result type (study, sample, experiment, assembly)
    response:
      format: json
    entity: dataset
tests:
  search:
  - name: searches for a study
    params:
      query: study_accession="PRJNA100001"
      result: study
      fields: study_accession,study_title
      format: json
      limit: 2
    assert:
    - minLength: 1
