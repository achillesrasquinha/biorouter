name: europepmc
displayName: Europe PMC
description: Europe PubMed Central — open-access biomedical literature
tags:
- literature
- publications
- open-access
- europe
- pmc
baseUrl: https://www.ebi.ac.uk/europepmc/webservices/rest
tools:
  search:
    description: Search Europe PMC for biomedical literature
    tags:
    - literature-search
    - paper-search
    method: GET
    path: /search
    params:
      query:
        type: string
        required: true
        mapsTo: query
        description: Search query (e.g. "CRISPR", "cancer immunotherapy")
      pageSize:
        type: integer
        default: 10
        mapsTo: pageSize
        description: Number of results to return
      format:
        type: string
        default: json
      resultType:
        type: string
        default: lite
        description: Result detail level (lite or core)
    response:
      format: json
      fields:
      - hitCount
      - resultList.result[].id
      - resultList.result[].title
      - resultList.result[].authorString
      - resultList.result[].journalTitle
      - resultList.result[].pubYear
      - resultList.result[].doi
      - resultList.result[].citedByCount
    entity: publication
  getArticle:
    description: Get a specific article by PubMed ID
    tags:
    - article-info
    - pmid-lookup
    method: GET
    path: /search
    params:
      pmid:
        type: string
        required: true
        mapsTo: query
        description: PubMed ID to look up (will be wrapped as EXT_ID query)
      format:
        type: string
        default: json
      resultType:
        type: string
        default: core
    response:
      format: json
      fields:
      - hitCount
      - resultList.result[].id
      - resultList.result[].pmid
      - resultList.result[].pmcid
      - resultList.result[].doi
      - resultList.result[].title
      - resultList.result[].authorString
      - resultList.result[].journalTitle
      - resultList.result[].pubYear
      - resultList.result[].abstractText
      - resultList.result[].citedByCount
    entity: publication
  getCitations:
    description: Get articles that cite a given article
    tags:
    - citations
    - citing-articles
    method: GET
    path: /{source}/{id}/citations
    params:
      source:
        type: string
        default: MED
        description: Source database (MED for PubMed, PMC for PubMed Central)
      id:
        type: string
        required: true
        description: Article identifier (e.g. PMID for MED source)
      format:
        type: string
        default: json
    response:
      format: json
      fields:
      - citationList.citation[].id
      - citationList.citation[].title
      - citationList.citation[].authorString
    entity: publication
  getReferences:
    description: Get references cited by an article
    tags:
    - references
    - bibliography
    method: GET
    path: /{source}/{id}/references
    params:
      source:
        type: string
        default: MED
        description: Source database (MED for PubMed, PMC for PubMed Central)
      id:
        type: string
        required: true
        description: Article identifier (e.g. PMID for MED source)
      format:
        type: string
        default: json
    response:
      format: json
      fields:
      - referenceList.reference[].id
      - referenceList.reference[].title
    entity: publication
  getFullTextXml:
    description: Get full text of an open-access article in XML format
    tags:
    - full-text
    - open-access-text
    method: GET
    path: /{source}/{id}/fullTextXML
    params:
      source:
        type: string
        default: PMC
        description: Source database (typically PMC for full text)
      id:
        type: string
        required: true
        description: PMC identifier (e.g. PMC7043279)
    response:
      format: xml
    entity: publication
tests:
  search:
  - name: searches for CRISPR literature
    params:
      query: CRISPR
    assert:
    - path: hitCount
      gt: 0
    - path: resultList.result
      minLength: 1
  getArticle:
  - name: gets a specific article by PMID
    params:
      pmid: EXT_ID:33086985
    assert:
    - path: hitCount
      gte: 1
    - path: resultList.result.0.pmid
      equals: '33086985'
  getCitations:
  - name: gets citations for a PubMed article
    params:
      source: MED
      id: '33086985'
    assert:
    - path: citationList.citation
      minLength: 1
  getReferences:
  - name: gets references for a PubMed article
    params:
      source: MED
      id: '33086985'
    assert:
    - path: referenceList.reference
      minLength: 1
    allowError: true
  getFullTextXml:
  - name: gets full text XML for a PMC article
    params:
      source: PMC
      id: PMC7043279
    assert:
    - minLength: 1
    allowError: true
