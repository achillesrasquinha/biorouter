name: fhir
displayName: FHIR R4
description: FHIR R4 public test server — HL7 FHIR standard for healthcare data interoperability
tags:
- fhir
- healthcare
- ehr
- clinical-data
- interoperability
baseUrl: https://hapi.fhir.org/baseR4
tools:
  searchResource:
    description: Search FHIR resources by type and query parameters
    tags:
    - fhir-search
    - resource-search
    method: GET
    path: /{resourceType}
    params:
      resourceType:
        type: string
        required: true
        description: FHIR resource type (e.g. Patient, Condition, Observation, MedicationRequest)
      query:
        type: string
        required: true
        mapsTo: _search
        description: Search query string
      _count:
        type: integer
        default: 5
        description: Maximum number of results to return
    response:
      format: json
      fields:
      - resourceType
      - entry[].resource.resourceType
      - entry[].resource.id
      - entry[].resource.identifier
      - entry[].resource.name
      - entry[].resource.gender
      - entry[].resource.birthDate
      - entry[].resource.active
    entity: dataset
  getResource:
    description: Get a specific FHIR resource by type and ID
    tags:
    - fhir-resource
    - resource-details
    method: GET
    path: /{resourceType}/{id}
    params:
      resourceType:
        type: string
        required: true
        description: FHIR resource type (e.g. Patient, Condition, Observation)
      id:
        type: string
        required: true
        description: FHIR resource ID
    response:
      format: json
      fields:
      - resourceType
      - id
      - identifier
      - name
      - gender
      - birthDate
      - active
    entity: dataset
  getPatient:
    description: Get a patient resource by ID
    tags:
    - fhir-patient
    - patient-info
    method: GET
    path: /Patient/{id}
    params:
      id:
        type: string
        required: true
        description: FHIR Patient resource ID
    response:
      format: json
      fields:
      - resourceType
      - id
      - name[].given
      - name[].family
      - gender
      - birthDate
    entity: sample
  getCondition:
    description: Search conditions for a patient
    tags:
    - fhir-condition
    - clinical-data
    method: GET
    path: /Condition
    params:
      patient:
        type: string
        required: true
        description: Patient ID to search conditions for
      _count:
        type: integer
        default: 10
        description: Maximum number of results to return
    response:
      format: json
      fields:
      - entry[].resource.code.coding[].display
      - entry[].resource.clinicalStatus.coding[].code
      - entry[].resource.resourceType
    entity: disease
  getMedicationRequest:
    description: Search medication requests for a patient
    tags:
    - fhir-medication
    - prescription
    method: GET
    path: /MedicationRequest
    params:
      patient:
        type: string
        required: true
        description: Patient ID to search medication requests for
      _count:
        type: integer
        default: 10
        description: Maximum number of results to return
    response:
      format: json
      fields:
      - entry[].resource.medicationCodeableConcept.coding[].display
      - entry[].resource.status
      - entry[].resource.resourceType
    entity: compound
  getObservation:
    description: Search observations for a patient
    tags:
    - fhir-observation
    - lab-results
    method: GET
    path: /Observation
    params:
      patient:
        type: string
        required: true
        description: Patient ID to search observations for
      category:
        type: string
        description: Observation category filter (e.g. "vital-signs", "laboratory")
      _count:
        type: integer
        default: 20
        description: Maximum number of results to return
    response:
      format: json
      fields:
      - entry[].resource.code.coding[].display
      - entry[].resource.valueQuantity.value
      - entry[].resource.valueQuantity.unit
      - entry[].resource.resourceType
    entity: assay
tests:
  searchResource:
  # NOTE: HAPI FHIR public test server may be down or have no matching data.
  - name: searches for Patient resources
    params:
      resourceType: Patient
      query: Smith
      _count: 5
    assert:
    - {}
    allowError: true
  getResource:
  - name: gets a Patient resource by ID
    params:
      resourceType: Patient
      id: '1'
    assert:
    - {}
    allowError: true
  getPatient:
  - name: gets a patient by ID
    params:
      id: '1'
    assert:
    - {}
    allowError: true
  getCondition:
  - name: searches conditions for a patient
    params:
      patient: '1'
      _count: 5
    assert:
    - {}
    allowError: true
  getMedicationRequest:
  - name: searches medication requests for a patient
    params:
      patient: '1'
      _count: 5
    assert:
    - {}
    allowError: true
  getObservation:
  - name: searches observations for a patient
    params:
      patient: '1'
      _count: 5
    assert:
    - {}
    allowError: true
