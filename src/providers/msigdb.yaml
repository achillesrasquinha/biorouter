name: msigdb
displayName: MSigDB
description: Molecular Signatures Database — curated gene set collections for enrichment analysis
tags:
- gene-set
- enrichment
- msigdb
- hallmark
- pathway
- signature
baseUrl: https://www.gsea-msigdb.org/gsea/msigdb/human
tools:
  getGeneSet:
    description: Get a gene set with all member genes
    tags:
    - gene-set-info
    - enrichment-lookup
    method: GET
    path: /download_geneset.jsp
    params:
      geneSetName:
        type: string
        required: true
        description: Gene set name e.g. 'HALLMARK_APOPTOSIS', 'KEGG_CELL_CYCLE'
      fileType:
        type: string
        default: json
    response:
      format: json
      fields:
      - '{geneSetName}.systematicName'
      - '{geneSetName}.collection'
      - '{geneSetName}.geneSymbols'
      - '{geneSetName}.pmid'
      - '{geneSetName}.msigdbURL'
      - '{geneSetName}.exactSource'
    entity: gene
tests:
  getGeneSet:
  - name: gets HALLMARK_APOPTOSIS gene set
    params:
      geneSetName: HALLMARK_APOPTOSIS
    assert:
    - path: HALLMARK_APOPTOSIS
    - path: HALLMARK_APOPTOSIS.geneSymbols
      minLength: 1
