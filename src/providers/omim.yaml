name: omim
displayName: OMIM
description: Online Mendelian Inheritance in Man — catalog of human genes and genetic disorders
tags:
- mendelian-disease
- genetics
- gene-phenotype
- clinical-genetics
- omim
baseUrl: https://api.omim.org/api
auth:
  type: apiKey
  param: apiKey
  env: LS_OMIM_API_KEY
tools:
  search:
    description: Search OMIM entries by keyword (genes, diseases, phenotypes)
    tags:
    - gene-search
    - disease-search
    - phenotype-search
    method: GET
    path: /entry/search
    params:
      query:
        type: string
        required: true
        mapsTo: search
        description: Search query (e.g. "BRCA1", "Marfan syndrome", "cardiomyopathy")
      limit:
        type: integer
        default: 10
        description: Number of results
      start:
        type: integer
        default: 0
        description: Result offset for pagination
      include:
        type: string
        default: geneMap
        description: Data to include (geneMap, text, clinicalSynopsis)
      format:
        type: string
        default: json
    response:
      format: json
      fields:
      - omim.searchResponse.totalResults
      - omim.searchResponse.startIndex
      - omim.searchResponse.endIndex
      - omim.searchResponse.searchResultList[].preferredTitle
      - omim.searchResponse.searchResultList[].mimNumber
      - omim.searchResponse.searchResultList[].geneSymbols
      - omim.searchResponse.searchResultList[].status
    entity: gene
  getEntry:
    description: Get an OMIM entry by MIM number
    tags:
    - gene-info
    - disease-info
    - entry-details
    method: GET
    path: /entry
    params:
      mimNumber:
        type: string
        required: true
        description: OMIM MIM number (e.g. 147920, 176000)
      include:
        type: string
        default: geneMap,clinicalSynopsis
        description: Data to include (geneMap, text, clinicalSynopsis, externalLinks)
      format:
        type: string
        default: json
    response:
      format: json
      fields:
      - omim.entryList[].entry.mimNumber
      - omim.entryList[].entry.prefix
      - omim.entryList[].entry.status
      - omim.entryList[].entry.titles.preferredTitle
      - omim.entryList[].entry.titles.alternativeTitles
      - omim.entryList[].entry.geneMap.geneSymbols
      - omim.entryList[].entry.geneMap.geneName
      - omim.entryList[].entry.geneMap.chromosomeSymbol
    entity: gene
  getClinicalSynopsis:
    description: Get clinical synopsis for an OMIM phenotype entry
    tags:
    - clinical-features
    - phenotype-details
    method: GET
    path: /clinicalSynopsis
    params:
      mimNumber:
        type: string
        required: true
        description: OMIM MIM number for a phenotype entry
      include:
        type: string
        default: clinicalSynopsis
      format:
        type: string
        default: json
    response:
      format: json
      fields:
      - omim.clinicalSynopsisList[].clinicalSynopsis.mimNumber
      - omim.clinicalSynopsisList[].clinicalSynopsis.preferredTitle
      - omim.clinicalSynopsisList[].clinicalSynopsis.inheritanceExists
      - omim.clinicalSynopsisList[].clinicalSynopsis.headAndNeckExists
      - omim.clinicalSynopsisList[].clinicalSynopsis.neurologicExists
    entity: disease
tests:
  search:
  - name: searches for Marfan syndrome
    params:
      query: Marfan syndrome
    assert:
    - path: omim.searchResponse.totalResults
      gt: 0
    allowError: true
  getEntry:
  - name: gets BRCA1 entry
    params:
      mimNumber: '113705'
    assert:
    - path: omim.entryList
      minLength: 1
    allowError: true
