name: tcia
displayName: TCIA
description: The Cancer Imaging Archive — public access to cancer medical imaging data and collections
tags:
- medical-imaging
- cancer
- radiology
- tcia
- dicom
baseUrl: https://services.cancerimagingarchive.net/nbia-api/services/v1
tools:
  getCollections:
    description: List all available imaging collections in TCIA
    tags:
    - collection-list
    - imaging-collections
    method: GET
    path: /getCollectionValues
    params: {}
    response:
      format: json
      fields:
      - '[].Collection'
    entity: dataset
  getPatients:
    description: Get patient study data for a specific TCIA collection
    tags:
    - patient-data
    - study-data
    method: GET
    path: /getPatientStudy
    params:
      collection:
        type: string
        required: true
        mapsTo: Collection
        description: Collection name (e.g. "TCGA-LUAD", "TCGA-BRCA")
    response:
      format: json
      fields:
      - '[].PatientID'
      - '[].PatientSex'
      - '[].PatientAge'
      - '[].Collection'
      - '[].StudyDate'
      - '[].SeriesCount'
    entity: dataset
tests:
  getCollections:
  - name: lists available collections
    params: {}
    assert:
    - isArray: true
    - path: 0.Collection
  getPatients:
  - name: gets patient data for TCGA-LUAD
    params:
      collection: TCGA-LUAD
    assert:
    - isArray: true
    - path: 0.PatientID
