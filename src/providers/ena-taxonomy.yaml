name: ena-taxonomy
displayName: ENA Taxonomy
description: EBI ENA Taxonomy — taxonomic classification lookup with lineage and common names
tags:
  - taxonomy
  - species
  - classification
  - ena
  - lineage
baseUrl: https://www.ebi.ac.uk/ena/taxonomy/rest
tools:
  getByTaxId:
    description: Get taxonomy information by NCBI taxon ID
    tags:
      - taxon-lookup
      - tax-id
    method: GET
    path: /tax-id/{taxId}
    params:
      taxId:
        type: integer
        required: true
        description: NCBI taxonomy ID (e.g. 9606 for human, 10090 for mouse)
    response:
      format: json
      fields:
        - taxId
        - scientificName
        - commonName
        - rank
        - division
        - lineage
  searchByName:
    description: Search taxonomy by scientific name
    tags:
      - name-search
      - species-search
    method: GET
    path: /scientific-name/{name}
    params:
      name:
        type: string
        required: true
        description: Scientific name to search (e.g. Homo sapiens, Mus musculus)
    response:
      format: json
      fields:
        - "[].taxId"
        - "[].scientificName"
        - "[].commonName"
        - "[].rank"
        - "[].division"
        - "[].lineage"
  suggest:
    description: Suggest taxonomy names for autocomplete search
    tags:
      - suggest
      - autocomplete
    method: GET
    path: /suggest-for-search/{term}
    params:
      term:
        type: string
        required: true
        description: Partial name to search (e.g. human, mouse, escherichia)
    response:
      format: json
      fields:
        - "[].taxId"
        - "[].scientificName"
        - "[].commonName"
tests:
  getByTaxId:
    - name: gets human taxonomy
      params:
        taxId: 9606
      assert:
        - path: taxId
          equals: "9606"
        - path: scientificName
          equals: Homo sapiens
  suggest:
    - name: suggests for human
      params:
        term: human
      assert:
        - path: ""
          minLength: 1
        - path: "0.scientificName"
