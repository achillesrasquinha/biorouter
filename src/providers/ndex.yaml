name: ndex
displayName: NDEx
description: NDEx Network Data Exchange for biological network models
tags:
- networks
- pathways
- signaling
- protein-interactions
- systems-biology
baseUrl: https://www.ndexbio.org/v2
tools:
  search:
    description: Search for biological networks by keyword
    tags:
    - network-search
    - pathway-search
    method: POST
    path: /search/network
    params:
      searchString:
        type: string
        required: true
        description: Search terms (e.g. "EGFR signaling", "p53 pathway")
      start:
        type: integer
        default: 0
        description: Offset for pagination
      size:
        type: integer
        default: 5
        description: Number of results to return
    response:
      format: json
      fields:
      - numFound
      - networks[].externalId
      - networks[].name
      - networks[].description
      - networks[].owner
      - networks[].nodeCount
      - networks[].edgeCount
      - networks[].visibility
    entity: dataset
  getNetwork:
    description: Get network summary by NDEx UUID
    tags:
    - network-info
    - network-summary
    method: GET
    path: /network/{networkId}/summary
    params:
      networkId:
        type: string
        required: true
        description: NDEx network UUID
    response:
      format: json
      fields:
      - externalId
      - name
      - description
      - owner
      - version
      - nodeCount
      - edgeCount
      - visibility
    entity: network
tests:
  search:
  - name: searches networks for EGFR signaling
    params:
      searchString: EGFR signaling
      size: 5
    assert:
    - path: numFound
      gt: 0
    - path: networks
      minLength: 1
  - name: searches networks for NCI pathway
    params:
      searchString: NCI pathway
      size: 1
    assert:
    - path: networks
      minLength: 1
    - path: networks.0.name
