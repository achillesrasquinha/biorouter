name: amoebadb
displayName: AmoebaDB
description: AmoebaDB — VEuPathDB resource for Entamoeba and free-living amoeba genomics
tags:
  - amoeba
  - parasite
  - veupathdb
  - genomics
baseUrl: https://amoebadb.org/amoeba/service
tools:
  listRecordTypes:
    description: List available record types in AmoebaDB
    tags:
      - record-types
      - metadata
    method: GET
    path: /record-types
    params: {}
    response:
      format: json
  search:
    description: Search AmoebaDB for genes and genomic features
    tags:
      - gene-search
      - amoeba-search
    method: GET
    path: /search
    params:
      q:
        type: string
        required: true
        description: Search query
      format:
        type: string
        default: json
        description: Response format
      size:
        type: integer
        default: 10
        description: Number of results
    response:
      format: json
tests:
  listRecordTypes:
    - name: lists record types
      params: {}
      assert:
        - minLength: 1
