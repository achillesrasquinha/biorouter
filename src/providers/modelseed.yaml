name: modelseed
displayName: ModelSEED
description: ModelSEED — automated metabolic model reconstruction and biochemistry database
tags:
- metabolic-models
- biochemistry
- compounds
- reactions
- flux-balance
baseUrl: https://modelseed.org/api/v2
tools:
  getModel:
    description: Get a metabolic model by ID
    tags:
    - model-info
    - metabolic-model
    method: GET
    path: /models/{id}
    params:
      id:
        type: string
        required: true
        description: ModelSEED model identifier
    response:
      format: json
    entity: structure
  searchCompounds:
    description: Search the ModelSEED biochemistry compound database
    tags:
    - compound-search
    - metabolite-search
    method: GET
    path: /biochemistry/compounds
    params:
      query:
        type: string
        required: true
        description: Compound name or partial name (e.g. "glucose", "ATP", "pyruvate")
    response:
      format: json
    entity: compound
  searchReactions:
    description: Search the ModelSEED biochemistry reaction database
    tags:
    - reaction-search
    - enzyme-search
    method: GET
    path: /biochemistry/reactions
    params:
      query:
        type: string
        required: true
        description: Reaction name or identifier (e.g. "glycolysis", "rxn00001")
    response:
      format: json
    entity: reaction
tests:
  getModel:
  - name: gets a metabolic model by ID
    params:
      id: '1'
    assert:
    - minLength: 1
    allowError: true
  searchCompounds:
  - name: searches compounds for glucose
    params:
      query: glucose
    assert:
    - minLength: 1
    allowError: true
  searchReactions:
  - name: searches reactions for glycolysis
    params:
      query: glycolysis
    assert:
    - minLength: 1
    allowError: true
