name: elm
displayName: Eukaryotic Linear Motifs
description: ELM — resource for predicting and annotating short linear motifs in eukaryotic proteins
tags:
- motif
- protein
- linear-motif
- elm
- functional-site
baseUrl: http://elm.eu.org
tools:
  listClasses:
    description: List all ELM motif classes
    tags:
    - motif-classes
    - catalogue
    method: GET
    path: /elms/elms_index.tsv
    params: {}
    response:
      format: tsv
      columns:
      - Accession
      - ELMIdentifier
      - FunctionalSiteName
      - Description
      - Regex
      - Probability
      - Instances
      - Instances_in_PDB
    entity: ontology-term
  getInstances:
    description: Get motif instances for a UniProt protein
    tags:
    - motif-instances
    - protein-annotation
    method: GET
    path: /instances.gff
    params:
      q:
        type: string
        required: true
        description: UniProt accession (e.g. "P04637")
    response:
      format: tsv
      columns:
      - seqid
      - source
      - type
      - start
      - end
      - score
      - strand
      - phase
      - attributes
    entity: protein
tests:
  listClasses:
  - name: lists all ELM motif classes
    params: {}
    assert:
    - isArray: true
      minLength: 1
  getInstances:
  - name: gets motif instances for p53 (P04637)
    params:
      q: P04637
    assert:
    - isArray: true
      minLength: 1
