name: depmap
displayName: DepMap
description: Cancer Dependency Map — cell line genomic and dependency data
tags:
- cancer
- cell-line
- dependency
- depmap
- ccle
- genomics
baseUrl: https://depmap.org/portal/api
tools:
  searchGene:
    description: Search genes in DepMap
    tags:
    - gene-search
    - cancer-dependency
    method: GET
    path: /v1/gene/search
    params:
      query:
        type: string
        required: true
        description: Gene name or symbol to search for
    response:
      format: json
      fields:
      - '[].geneId'
      - '[].symbol'
      - '[].name'
      - '[].entrezId'
      - '[].description'
    entity: gene
  getGeneDependency:
    description: Get gene dependency scores across cell lines
    tags:
    - dependency-score
    - cell-line
    method: GET
    path: /v1/gene/{geneId}/dependency
    params:
      geneId:
        type: string
        required: true
        description: Gene identifier
    response:
      format: json
      fields:
      - '[].cellLineName'
      - '[].cellLineId'
      - '[].dependencyScore'
      - '[].geneId'
      - '[].dataset'
    entity: gene
  getCellLine:
    description: Get cell line information by DepMap cell line ID
    tags:
    - cell-line-info
    - cancer-cell-line
    method: GET
    path: /v1/cell_line/{cellLineId}
    params:
      cellLineId:
        type: string
        required: true
        description: DepMap cell line identifier (e.g. ACH-000001)
    response:
      format: json
      fields:
      - cellLineId
      - cellLineName
      - lineage
      - primaryDisease
      - subtype
    entity: sample
tests:
  searchGene:
  - name: searches for BRAF gene
    params:
      query: BRAF
    assert:
    - {}
  getCellLine:
  - name: gets cell line ACH-000001
    params:
      cellLineId: ACH-000001
    assert:
    - {}
    allowError: true
