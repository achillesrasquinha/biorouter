name: gtex
displayName: GTEx Portal
description: Genotype-Tissue Expression project — gene expression across human tissues
tags:
- gene-expression
- tissue
- eqtl
- gtex
- transcriptomics
baseUrl: https://gtexportal.org/api/v2
tools:
  getGene:
    description: Look up gene reference information by gene symbol
    tags:
    - gene-lookup
    - gene-reference
    method: GET
    path: /reference/gene
    params:
      geneId:
        type: string
        required: true
        description: Gene symbol (e.g. BRCA1, TP53)
      gencodeVersion:
        type: string
        default: v26
        description: GENCODE version
      genomeBuild:
        type: string
        default: GRCh38/hg38
        description: Genome build
    response:
      format: json
      fields:
      - data[].gencodeId
      - data[].geneSymbol
      - data[].description
      - data[].chromosome
      - data[].start
      - data[].end
      - data[].geneType
      - data[].entrezGeneId
    entity: gene
  getExpression:
    description: Get median gene expression across tissues
    tags:
    - expression-data
    - tissue-expression
    method: GET
    path: /expression/medianGeneExpression
    params:
      gencodeId:
        type: string
        required: true
        description: GENCODE gene ID (e.g. ENSG00000012048.20 for BRCA1)
      datasetId:
        type: string
        default: gtex_v8
        description: GTEx dataset version
    response:
      format: json
      fields:
      - data[].geneSymbol
      - data[].gencodeId
      - data[].tissueSiteDetailId
      - data[].median
      - data[].unit
    entity: expression
  getEqtl:
    description: Get single-tissue eQTL associations for a gene
    tags:
    - eqtl
    - genetic-association
    - tissue-specific
    method: GET
    path: /association/singleTissueEqtl
    params:
      gencodeId:
        type: string
        required: true
        description: GENCODE gene ID (e.g. ENSG00000139618.18)
      tissueSiteDetailId:
        type: string
        required: true
        description: GTEx tissue ID (e.g. Liver, Brain_Cortex)
      datasetId:
        type: string
        default: gtex_v8
        description: GTEx dataset version
    response:
      format: json
      fields:
      - data[].geneSymbol
      - data[].variantId
      - data[].pValue
      - data[].nes
      - data[].tissueSiteDetailId
    entity: gene
  getTopExpressed:
    description: Get top expressed genes in a specific tissue
    tags:
    - top-expression
    - tissue-specific
    method: GET
    path: /expression/topExpressedGene
    params:
      tissueSiteDetailId:
        type: string
        required: true
        description: GTEx tissue ID (e.g. Liver, Brain_Cortex)
      datasetId:
        type: string
        default: gtex_v8
        description: GTEx dataset version
      pageSize:
        type: integer
        default: 50
        description: Number of top genes to return
    response:
      format: json
      fields:
      - data[].geneSymbol
      - data[].gencodeId
      - data[].median
      - data[].unit
    entity: gene
  getTissues:
    description: List all available GTEx tissue types
    tags:
    - tissue-list
    - reference
    method: GET
    path: /dataset/tissueSiteDetail
    params:
      datasetId:
        type: string
        default: gtex_v8
        description: GTEx dataset version
    response:
      format: json
      fields:
      - data[].tissueSiteDetailId
      - data[].tissueSiteDetail
      - data[].tissueSite
    entity: expression
tests:
  getGene:
  - name: looks up BRCA1 gene reference info
    params:
      geneId: BRCA1
    assert:
    - path: data
      minLength: 1
    - path: data.0.geneSymbol
      equals: BRCA1
  getExpression:
  - name: gets median gene expression for BRCA1 across tissues
    params:
      gencodeId: ENSG00000012048.20
    assert:
    - path: data
      minLength: 1
    - path: data.0.tissueSiteDetailId
  getEqtl:
  - name: gets eQTL associations for BRCA2 in Liver
    params:
      gencodeId: ENSG00000139618.18
      tissueSiteDetailId: Liver
    assert:
    - path: data
  getTopExpressed:
  - name: gets top expressed genes in Liver
    params:
      tissueSiteDetailId: Liver
    assert:
    - path: data
      minLength: 1
    - path: data.0.geneSymbol
  getTissues:
  - name: lists all available GTEx tissues
    params: {}
    assert:
    - path: data
      minLength: 1
    - path: data.0.tissueSiteDetailId
