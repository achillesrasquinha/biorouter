name: rxnorm
displayName: RxNorm
description: NLM drug terminology for normalized drug names and interactions
tags:
  - drug
  - terminology
  - rxnorm
  - medication
  - prescription
  - nlm
baseUrl: https://rxnav.nlm.nih.gov/REST
tools:
  search:
    description: Search drugs by name in RxNorm
    tags:
      - drug-search
      - rxnorm-search
    method: GET
    path: /drugs.json
    params:
      name:
        type: string
        required: true
        description: Drug name to search for (e.g. "metformin", "aspirin")
    response:
      format: json
      fields:
        - drugGroup.name
        - drugGroup.conceptGroup[].tty
        - drugGroup.conceptGroup[].conceptProperties[].rxcui
        - drugGroup.conceptGroup[].conceptProperties[].name
        - drugGroup.conceptGroup[].conceptProperties[].synonym
        - drugGroup.conceptGroup[].conceptProperties[].tty
  getProperties:
    description: Get drug concept properties by RxCUI
    tags:
      - drug-properties
      - rxcui
    method: GET
    path: /rxcui/{rxcui}/properties.json
    params:
      rxcui:
        type: string
        required: true
        description: RxNorm concept unique identifier (e.g. "861004")
    response:
      format: json
      fields:
        - properties.rxcui
        - properties.name
        - properties.synonym
        - properties.tty
        - properties.language
  getAllRelated:
    description: Get all related drug concepts (brand names, ingredients, dose forms) by RxCUI
    tags:
      - drug-related
      - rxcui
      - concepts
    method: GET
    path: /rxcui/{rxcui}/allrelated.json
    params:
      rxcui:
        type: string
        required: true
        description: RxNorm concept unique identifier (e.g. "6809" for metformin)
    response:
      format: json
      fields:
        - allRelatedGroup.rxcui
        - allRelatedGroup.conceptGroup[].tty
        - allRelatedGroup.conceptGroup[].conceptProperties[].rxcui
        - allRelatedGroup.conceptGroup[].conceptProperties[].name
        - allRelatedGroup.conceptGroup[].conceptProperties[].tty
  getDrugInteractions:
    description: Get drug interactions by RxCUI
    tags:
      - drug-interaction
      - rxcui
    method: GET
    path: /interaction/interaction.json
    params:
      rxcui:
        type: string
        required: true
        description: RxNorm concept unique identifier (e.g. "161" for acetaminophen)
    response:
      format: json
      fields:
        - interactionTypeGroup[].interactionType[].interactionPair[].interactionConcept[].minConceptItem.name
        - interactionTypeGroup[].interactionType[].interactionPair[].description
  getSpellingSuggestions:
    description: Get spelling suggestions for a drug name
    tags:
      - drug-spelling
      - suggestions
    method: GET
    path: /spellingsuggestions.json
    params:
      name:
        type: string
        required: true
        description: Drug name to get spelling suggestions for (e.g. "ambienn")
    response:
      format: json
      fields:
        - suggestionGroup.suggestionList.suggestion
        - suggestionGroup.name
  getRxcuiByString:
    description: Get RxCUI for a drug by name string
    tags:
      - rxcui-lookup
      - drug-id
    method: GET
    path: /rxcui.json
    params:
      name:
        type: string
        required: true
        description: Drug name to look up (e.g. "metformin")
    response:
      format: json
      fields:
        - idGroup.rxnormId
        - idGroup.name
  getRelated:
    description: Get related drug concepts by RxCUI and term type
    tags:
      - drug-related
      - rxcui
      - term-type
    method: GET
    path: /rxcui/{rxcui}/related.json
    params:
      rxcui:
        type: string
        required: true
        description: RxNorm concept unique identifier
      tty:
        type: string
        default: SBD+SCD
        description: Term types to filter by (e.g. "SBD+SCD" for branded and clinical drugs)
    response:
      format: json
      fields:
        - relatedGroup.conceptGroup[].conceptProperties[].rxcui
        - relatedGroup.conceptGroup[].conceptProperties[].name
        - relatedGroup.conceptGroup[].conceptProperties[].tty
tests:
  search:
    - name: searches for metformin
      params:
        name: metformin
      assert:
        - {}
        - anyOf:
            - drugGroup
            - conceptGroup
  getProperties:
    - name: gets properties for an RxCUI
      params:
        rxcui: "861004"
      assert:
        - {}
        - path: properties
  getAllRelated:
    - name: gets all related concepts for metformin
      params:
        rxcui: "6809"
      assert:
        - {}
        - path: allRelatedGroup
  getDrugInteractions:
    - name: gets drug interactions for acetaminophen (161)
      params:
        rxcui: "161"
      assert:
        - {}
      allowError: true
  getSpellingSuggestions:
    - name: gets spelling suggestions for ambienn
      params:
        name: ambienn
      assert:
        - {}
        - path: suggestionGroup
  getRxcuiByString:
    - name: gets RxCUI for metformin
      params:
        name: metformin
      assert:
        - {}
        - path: idGroup
  getRelated:
    - name: gets related concepts for metformin (6809)
      params:
        rxcui: "6809"
      assert:
        - {}
        - path: relatedGroup
