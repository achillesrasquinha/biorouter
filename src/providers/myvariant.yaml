name: myvariant
displayName: MyVariant.info
description: Variant annotation query service — aggregates genetic variant data from multiple sources
tags:
- variant
- snp
- mutation
- biothings
- genomics
baseUrl: https://myvariant.info/v1
tools:
  search:
    description: Search for genetic variants by keyword or query
    tags:
    - variant-search
    - snp-search
    method: GET
    path: /query
    params:
      query:
        type: string
        required: true
        mapsTo: q
        description: Search query (e.g. "rs7412", "BRCA1")
      size:
        type: integer
        default: 10
        description: Number of results to return
    response:
      format: json
      fields:
      - total
      - hits[]._id
      - hits[]._score
      - hits[].chrom
      - hits[].dbsnp
      - hits[].clinvar
      - hits[].cadd
    entity: gene
  getVariant:
    description: Get variant annotation by HGVS ID
    tags:
    - variant-info
    - variant-annotation
    method: GET
    path: /variant/{variantId}
    params:
      variantId:
        type: string
        required: true
        description: HGVS variant ID (e.g. "chr19:g.44908684T>C")
    response:
      format: json
      fields:
      - _id
      - chrom
      - dbsnp
      - clinvar
      - cadd
      - dbnsfp
      - gnomad_exome
    entity: variant
tests:
  search:
  - name: searches for rs7412 variant
    params:
      query: rs7412
    assert:
    - path: hits
      minLength: 1
  getVariant:
  - name: gets variant annotation by HGVS ID
    params:
      variantId: chr19:g.45412079C>T
    assert:
    - anyOf:
      - _id
      - dbsnp
