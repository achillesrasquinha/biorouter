name: ddbj
displayName: DDBJ
description: DNA Data Bank of Japan — nucleotide sequence archive
tags:
- sequence
- nucleotide
- ddbj
- japan
- dna
baseUrl: https://getentry.ddbj.nig.ac.jp/getentry
tools:
  getEntry:
    description: Get a DDBJ nucleotide entry by accession
    tags:
    - sequence-lookup
    - nucleotide-entry
    method: GET
    path: /na/{id}
    params:
      id:
        type: string
        required: true
        description: Accession e.g. 'AB000001'
      format:
        type: string
        default: flatfile
    response:
      format: keyvalue
      fields:
      - LOCUS
      - DEFINITION
      - ACCESSION
      - ORGANISM
      - REFERENCE
    entity: dataset
tests:
  getEntry:
  - name: gets entry for AB000001
    params:
      id: AB000001
    assert:
    - isNonEmpty: true
