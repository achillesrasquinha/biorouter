name: ncbi-gene
displayName: NCBI Gene
description: Gene-specific information from NCBI Entrez Gene database
tags:
- gene
- ncbi
- entrez
- gene-function
- gene-expression
baseUrl: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
tools:
  search:
    description: Search NCBI Gene database for genes by keyword
    tags:
    - gene-search
    - entrez-search
    method: GET
    path: /esearch.fcgi
    params:
      query:
        type: string
        required: true
        mapsTo: term
        description: Search query (e.g. "BRCA1", "tumor suppressor")
      maxResults:
        type: integer
        default: 10
        mapsTo: retmax
      db:
        type: string
        default: gene
      retmode:
        type: string
        default: json
    response:
      format: json
      fields:
      - esearchresult.count
      - esearchresult.idlist
      - esearchresult.querytranslation
    entity: gene
  getSummary:
    description: Get gene summary information by NCBI Gene ID
    tags:
    - gene-info
    - gene-summary
    method: GET
    path: /esummary.fcgi
    params:
      id:
        type: string
        required: true
        description: NCBI Gene ID (e.g. "672" for BRCA1)
      db:
        type: string
        default: gene
      retmode:
        type: string
        default: json
    response:
      format: json
    entity: gene
tests:
  search:
  - name: searches for BRCA1 gene
    params:
      query: BRCA1
    assert:
    - path: esearchresult.idlist
      minLength: 1
  getSummary:
  - name: gets gene summary for BRCA1 by ID
    params:
      id: '672'
    assert:
    - path: result.672
