name: peptideatlas
displayName: PeptideAtlas
description: PeptideAtlas — proteomics data repository for peptide and protein identifications
tags:
- proteomics
- peptides
- mass-spectrometry
- peptideatlas
# NOTE: PeptideAtlas has bot protection that serves an HTML challenge page
# instead of JSON to automated requests. Tests may fail with non-JSON responses.
baseUrl: https://db.systemsbiology.net/sbeams/cgi/PeptideAtlas
tools:
  getProtein:
    description: Get protein details and observed peptides from PeptideAtlas
    tags:
    - protein-info
    - peptide-info
    method: GET
    path: /GetProtein
    params:
      protein_name:
        type: string
        required: true
        mapsTo: protein_name
        description: Protein name or accession (e.g. EGFR, P00533)
      atlas_build_id:
        type: integer
        default: 570
        mapsTo: atlas_build_id
        description: Atlas build ID (default 570 for human)
      action:
        type: string
        default: QUERY
        description: Action type
    response:
      format: json
    entity: protein
  search:
    description: Search PeptideAtlas for proteins matching a query
    tags:
    - protein-search
    - proteomics-search
    method: GET
    path: /GetProteins
    params:
      protein_name_constraint:
        type: string
        required: true
        mapsTo: protein_name_constraint
        description: Protein name or pattern to search (e.g. "BRCA1", "kinase")
      atlas_build_id:
        type: integer
        default: 570
        mapsTo: atlas_build_id
        description: Atlas build ID (default 570 for human)
    response:
      format: json
    entity: protein
tests:
  getProtein:
  - name: gets protein details for EGFR
    params:
      protein_name: EGFR
      atlas_build_id: 570
      action: QUERY
    assert:
    - {}
    allowError: true
  search:
  - name: searches for BRCA1 proteins
    params:
      protein_name_constraint: BRCA1
      atlas_build_id: 570
    assert:
    - {}
    allowError: true
