name: pubmed
displayName: PubMed
description: Biomedical literature search engine (NCBI)
tags:
  - literature
  - publications
  - abstracts
  - ncbi
  - medline
baseUrl: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
tools:
  search:
    description: Search PubMed for biomedical literature
    tags:
      - literature-search
      - paper-search
    method: GET
    path: /esearch.fcgi
    params:
      query:
        type: string
        required: true
        mapsTo: term
        description: Search query (e.g. "CRISPR cas9 therapy")
      maxResults:
        type: integer
        default: 5
        mapsTo: retmax
      db:
        type: string
        default: pubmed
      retmode:
        type: string
        default: json
    response:
      format: json
      fields:
        - esearchresult.count
        - esearchresult.retmax
        - esearchresult.idlist
        - esearchresult.querytranslation
  getSummary:
    description: Get article summaries by PubMed IDs
    tags:
      - article-info
      - abstract
      - citation
    method: GET
    path: /esummary.fcgi
    params:
      ids:
        type: string
        required: true
        mapsTo: id
        description: Comma-separated PubMed IDs (e.g. "33086985,32015508")
      db:
        type: string
        default: pubmed
      retmode:
        type: string
        default: json
    response:
      format: json
      fields:
        - result.uids
        - result.*.uid
        - result.*.title
        - result.*.pubdate
        - result.*.source
        - result.*.authors[].name
        - result.*.fulljournalname
        - result.*.volume
        - result.*.issue
        - result.*.pages
  getArticle:
    description: Get full article details by PubMed ID using efetch
    tags:
      - article-detail
      - full-record
    method: GET
    path: /efetch.fcgi
    params:
      pmid:
        type: string
        required: true
        mapsTo: id
        description: PubMed ID (e.g. "33086985")
      db:
        type: string
        default: pubmed
      retmode:
        type: string
        default: xml
      rettype:
        type: string
        default: abstract
    response:
      format: xml
      fields:
        - PubmedArticleSet.PubmedArticle.MedlineCitation.Article.ArticleTitle
        - PubmedArticleSet.PubmedArticle.MedlineCitation.Article.Abstract.AbstractText
        - PubmedArticleSet.PubmedArticle.MedlineCitation.Article.AuthorList.Author
tests:
  search:
    - name: searches for CRISPR papers
      params:
        query: CRISPR cas9 therapy
      assert:
        - path: esearchresult.idlist
          minLength: 1
  getSummary:
    - name: gets article summary by PMID
      params:
        ids: "33086985"
      assert:
        - path: result.33086985.title
  getArticle:
    - name: gets full article details for PMID 33086985
      params:
        pmid: "33086985"
      assert:
        - {}
