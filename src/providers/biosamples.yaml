name: biosamples
displayName: BioSamples
description: EBI BioSamples database — biological sample metadata and attributes
tags:
- sample
- metadata
- biobank
- specimen
- biosamples
baseUrl: https://www.ebi.ac.uk/biosamples
tools:
  search:
    description: Search BioSamples for biological samples by keyword
    tags:
    - sample-search
    - specimen-search
    method: GET
    path: /samples
    params:
      query:
        type: string
        required: true
        mapsTo: text
        description: Search text (e.g. "human liver", "cancer cell line")
      size:
        type: integer
        default: 10
        description: Number of results to return
    response:
      format: json
      fields:
      - _embedded.samples[].accession
      - _embedded.samples[].name
      - _embedded.samples[].taxId
      - _embedded.samples[].status
      - _embedded.samples[].release
      - _embedded.samples[].characteristics
    entity: sample
  getSample:
    description: Get a specific BioSample by accession
    tags:
    - sample-info
    - specimen-info
    method: GET
    path: /samples/{accession}
    params:
      accession:
        type: string
        required: true
        description: BioSample accession (e.g. SAMD00065372)
    response:
      format: json
      fields:
      - accession
      - name
      - taxId
      - status
      - release
      - characteristics
    entity: sample
tests:
  search:
  - name: searches for human liver samples
    params:
      query: human liver
    assert:
    - path: _embedded.samples
      minLength: 1
    - path: _embedded.samples.0.accession
  getSample:
  - name: gets sample by accession SAMD00065372
    params:
      accession: SAMD00065372
    assert:
    - path: accession
      equals: SAMD00065372
    - path: characteristics
