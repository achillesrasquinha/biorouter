name: bioregistry
displayName: Bioregistry
description: Bioregistry — registry of 1000+ biological databases with identifier patterns and metadata
tags:
  - registry
  - identifiers
  - databases
  - metadata
  - prefixes
baseUrl: https://bioregistry.io/api
tools:
  getResource:
    description: Get metadata for a biological database by prefix
    tags:
      - database-info
      - registry-lookup
    method: GET
    path: /registry/{prefix}
    params:
      prefix:
        type: string
        required: true
        description: Database prefix (e.g. uniprot, chebi, go, hgnc, pdb)
    response:
      format: json
      fields:
        - prefix
        - name
        - description
        - pattern
        - uri_format
  resolveIdentifier:
    description: Resolve a CURIE to provider URLs across databases
    tags:
      - identifier-resolution
      - curie-lookup
    method: GET
    path: /reference/{curie}
    params:
      curie:
        type: string
        required: true
        description: CURIE to resolve (e.g. uniprot:P00734, chebi:15377, go:0005515)
    response:
      format: json
      fields:
        - query.prefix
        - query.identifier
        - providers
tests:
  getResource:
    - name: gets UniProt metadata
      params:
        prefix: uniprot
      assert:
        - path: prefix
        - path: name
  resolveIdentifier:
    - name: resolves a UniProt CURIE
      params:
        curie: uniprot:P00734
      assert:
        - path: providers
