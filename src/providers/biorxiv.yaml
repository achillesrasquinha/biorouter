name: biorxiv
displayName: bioRxiv
description: bioRxiv preprint server — access preprints in biology and related sciences
tags:
- preprints
- biorxiv
- medrxiv
- literature
- open-access
baseUrl: https://api.biorxiv.org
tools:
  getRecent:
    description: Get recent bioRxiv preprints from a date range
    tags:
    - preprint-search
    - recent-papers
    method: GET
    path: /details/biorxiv/{startDate}/{endDate}/{cursor}
    params:
      startDate:
        type: string
        required: true
        description: Start date in YYYY-MM-DD format
      endDate:
        type: string
        required: true
        description: End date in YYYY-MM-DD format
      cursor:
        type: integer
        default: 0
        description: Pagination cursor (0-based offset)
    response:
      format: json
      fields:
      - collection[].doi
      - collection[].title
      - collection[].authors
      - collection[].author_corresponding
      - collection[].author_corresponding_institution
      - collection[].date
      - collection[].version
      - collection[].type
      - collection[].category
      - collection[].abstract
    entity: publication
  getByDoi:
    description: Get a specific bioRxiv preprint by DOI suffix
    tags:
    - preprint-lookup
    - doi-lookup
    method: GET
    path: /details/biorxiv/10.1101/{doiSuffix}/na/json
    params:
      doiSuffix:
        type: string
        required: true
        description: DOI suffix after 10.1101/ (e.g. "2024.01.01.573838")
    response:
      format: json
      fields:
      - collection[].doi
      - collection[].title
      - collection[].authors
      - collection[].author_corresponding
      - collection[].author_corresponding_institution
      - collection[].date
      - collection[].version
      - collection[].type
      - collection[].category
      - collection[].abstract
    entity: publication
tests:
  getRecent:
  - name: gets recent preprints from a date range
    params:
      startDate: 2024-01-01
      endDate: 2024-01-02
    assert:
    - path: collection
      minLength: 1
    - path: collection.0.title
    - path: collection.0.doi
