name: hpo
displayName: Human Phenotype Ontology
description: Human Phenotype Ontology — standardized vocabulary of human phenotypic abnormalities
tags:
- phenotype
- ontology
- hpo
- disease
- clinical
baseUrl: https://ontology.jax.org/api
tools:
  searchTerms:
    description: Search the Human Phenotype Ontology by keyword
    tags:
    - phenotype-search
    - hpo-search
    method: GET
    path: /hp/search
    params:
      query:
        type: string
        required: true
        mapsTo: q
        description: Search query (e.g. epilepsy, cardiomyopathy, ataxia)
      max:
        type: integer
        default: 10
        description: Maximum number of results
    response:
      format: json
      fields:
      - terms[].id
      - terms[].name
      - terms[].definition
      - terms[].descendantCount
      - terms[].synonyms
    entity: ontology-term
  getTerm:
    description: Get a specific HPO term by its identifier
    tags:
    - phenotype-info
    - hpo-term
    method: GET
    path: /hp/terms/{id}
    params:
      id:
        type: string
        required: true
        description: HPO term identifier (e.g. HP:0001250, HP:0001263)
    response:
      format: json
      fields:
      - id
      - name
      - definition
      - comment
      - descendantCount
      - synonyms
    entity: ontology-term
  getTermGenes:
    description: Get genes associated with an HPO term via network annotations
    tags:
    - phenotype-genes
    - hpo-genes
    method: GET
    path: /network/annotation/{termId}
    params:
      termId:
        type: string
        required: true
        description: HPO term identifier (e.g. HP:0001250)
    response:
      format: json
      fields:
      - genes[].id
      - genes[].name
      - diseases[].id
      - diseases[].name
    entity: gene
  getDisease:
    description: Get disease details and associated phenotypes by disease identifier
    tags:
    - disease-info
    - hpo-disease
    method: GET
    path: /network/annotation/{diseaseId}
    params:
      diseaseId:
        type: string
        required: true
        description: Disease identifier (e.g. OMIM:154700)
    response:
      format: json
      fields:
      - disease.id
      - disease.name
      - categories[].catLabel
      - genes[].id
      - genes[].name
    entity: disease
tests:
  searchTerms:
  - name: searches for epilepsy phenotype terms
    params:
      query: epilepsy
      max: 5
    assert:
    - path: terms
      minLength: 1
    - path: terms.0.id
    - path: terms.0.name
  getTerm:
  - name: gets HPO term HP:0001250 (Seizure)
    params:
      id: HP:0001250
    assert:
    - path: id
      equals: HP:0001250
    - path: name
  getTermGenes:
  - name: gets genes associated with HP:0001250
    params:
      termId: HP:0001250
    assert:
    - path: genes
      minLength: 1
    - path: genes.0.id
    - path: genes.0.name
  getDisease:
  - name: gets disease details for OMIM:154700
    params:
      diseaseId: OMIM:154700
    assert:
    - path: disease
    - path: genes
      minLength: 1
