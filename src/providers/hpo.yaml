name: hpo
displayName: Human Phenotype Ontology
description: Human Phenotype Ontology — standardized vocabulary of human phenotypic abnormalities
tags:
  - phenotype
  - ontology
  - hpo
  - disease
  - clinical
baseUrl: https://ontology.jax.org/api/hp
tools:
  searchTerms:
    description: Search the Human Phenotype Ontology by keyword
    tags:
      - phenotype-search
      - hpo-search
    method: GET
    path: /search
    params:
      query:
        type: string
        required: true
        mapsTo: q
        description: Search query (e.g. epilepsy, cardiomyopathy, ataxia)
      max:
        type: integer
        default: 10
        description: Maximum number of results
    response:
      format: json
      fields:
        - terms[].id
        - terms[].name
        - terms[].definition
        - terms[].descendantCount
        - terms[].synonyms
  getTerm:
    description: Get a specific HPO term by its identifier
    tags:
      - phenotype-info
      - hpo-term
    method: GET
    path: /terms/{id}
    params:
      id:
        type: string
        required: true
        description: HPO term identifier (e.g. HP:0001250, HP:0001263)
    response:
      format: json
      fields:
        - id
        - name
        - definition
        - comment
        - descendantCount
        - synonyms
  getTermGenes:
    description: Get genes associated with an HPO term
    tags:
      - phenotype-genes
      - hpo-genes
    method: GET
    path: /terms/{termId}/genes
    params:
      termId:
        type: string
        required: true
        description: HPO term identifier (e.g. HP:0001250)
    response:
      format: json
      fields:
        - genes[].geneSymbol
        - genes[].geneId
        - genes[].dbDiseases
  getDisease:
    description: Get disease details by disease identifier
    tags:
      - disease-info
      - hpo-disease
    method: GET
    path: /diseases/{diseaseId}
    params:
      diseaseId:
        type: string
        required: true
        description: Disease identifier (e.g. OMIM:154700)
    response:
      format: json
      fields:
        - disease.diseaseName
        - disease.diseaseId
        - disease.catTermsMap
tests:
  searchTerms:
    - name: searches for epilepsy phenotype terms
      params:
        query: epilepsy
        max: 5
      assert:
        - path: terms
          minLength: 1
        - path: terms.0.id
        - path: terms.0.name
  getTerm:
    - name: gets HPO term HP:0001250 (Seizure)
      params:
        id: HP:0001250
      assert:
        - path: id
          equals: HP:0001250
        - path: name
  getTermGenes:
    - name: gets genes associated with HP:0001250
      params:
        termId: HP:0001250
      assert:
        - path: genes
          minLength: 1
        - path: genes.0.geneSymbol
  getDisease:
    - name: gets disease details for OMIM:154700
      params:
        diseaseId: OMIM:154700
      assert:
        - path: disease.diseaseName
        - path: disease.diseaseId
