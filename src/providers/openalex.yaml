name: openalex
displayName: OpenAlex
description: OpenAlex — open catalog of scholarly works, authors, institutions, and concepts
tags:
  - literature
  - scholarly
  - citations
  - openalex
  - publications
  - open-access
baseUrl: https://api.openalex.org
tools:
  searchWorks:
    description: Search scholarly works by keyword
    tags:
      - work-search
      - publication-search
    method: GET
    path: /works
    params:
      search:
        type: string
        required: true
        description: Search query e.g. 'CRISPR gene editing'
      per_page:
        type: integer
        default: 10
      filter:
        type: string
        description: Filter e.g. 'publication_year:2024'
    response:
      format: json
      fields:
        - meta.count
        - results[].id
        - results[].doi
        - results[].title
        - results[].publication_year
        - results[].type
        - results[].authorships[].author.display_name
        - results[].primary_location.source.display_name
        - results[].cited_by_count
        - results[].open_access.is_oa
  getWork:
    description: Get a specific scholarly work by OpenAlex ID
    tags:
      - work-info
      - publication-detail
    method: GET
    path: /works/{id}
    params:
      id:
        type: string
        required: true
        description: OpenAlex work ID e.g. 'W2741809807'
    response:
      format: json
      fields:
        - id
        - doi
        - title
        - publication_year
        - type
        - authorships[].author.display_name
        - primary_location.source.display_name
        - cited_by_count
        - open_access.is_oa
        - abstract_inverted_index
  searchAuthors:
    description: Search authors by name
    tags:
      - author-search
      - researcher-search
    method: GET
    path: /authors
    params:
      search:
        type: string
        required: true
        description: Author name e.g. 'Jennifer Doudna'
      per_page:
        type: integer
        default: 5
    response:
      format: json
      fields:
        - meta.count
        - results[].id
        - results[].display_name
        - results[].orcid
        - results[].works_count
        - results[].cited_by_count
        - results[].summary_stats.h_index
        - results[].last_known_institutions[].display_name
  getAuthor:
    description: Get an author profile by OpenAlex author ID
    tags:
      - author-info
      - researcher-detail
    method: GET
    path: /authors/{id}
    params:
      id:
        type: string
        required: true
        description: OpenAlex author ID e.g. 'A5023888391'
    response:
      format: json
      fields:
        - id
        - display_name
        - works_count
        - cited_by_count
        - last_known_institutions[].display_name
  getInstitution:
    description: Get institution details by OpenAlex institution ID
    tags:
      - institution-info
      - organization-detail
    method: GET
    path: /institutions/{id}
    params:
      id:
        type: string
        required: true
        description: OpenAlex institution ID e.g. 'I136199984'
    response:
      format: json
      fields:
        - id
        - display_name
        - country_code
        - type
        - works_count
  getConcept:
    description: Get concept/topic details by OpenAlex concept ID
    tags:
      - concept-info
      - topic-detail
    method: GET
    path: /concepts/{id}
    params:
      id:
        type: string
        required: true
        description: OpenAlex concept ID e.g. 'C86803240'
    response:
      format: json
      fields:
        - id
        - display_name
        - description
        - works_count
        - level
tests:
  searchWorks:
    - name: searches works for CRISPR
      params:
        search: CRISPR
      assert:
        - path: meta.count
          gt: 0
        - path: results
          minLength: 1
  getAuthor:
    - name: gets author by OpenAlex ID
      params:
        id: A5023888391
      assert:
        - path: display_name
        - path: id
  getInstitution:
    - name: gets institution by OpenAlex ID
      params:
        id: I136199984
      assert:
        - path: display_name
        - path: id
  getConcept:
    - name: gets concept by OpenAlex ID
      params:
        id: C86803240
      assert:
        - path: display_name
        - path: id
