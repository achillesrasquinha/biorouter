name: umls
displayName: UMLS
description: Unified Medical Language System — biomedical concepts, terminology crosswalk, and semantic network
tags:
- medical-terminology
- umls
- controlled-vocabulary
- nlm
- crosswalk
baseUrl: https://uts-ws.nlm.nih.gov/rest
auth:
  type: apiKey
  param: apiKey
  env: LS_UMLS_API_KEY
  required: true
rateLimit:
  requestsPerSecond: 8
tools:
  searchConcepts:
    description: Search UMLS Metathesaurus concepts by term
    tags:
    - concept-search
    - terminology-search
    method: GET
    path: /search/current
    params:
      query:
        type: string
        required: true
        mapsTo: string
        description: Search term (e.g. "diabetes", "hypertension", "aspirin")
      searchType:
        type: string
        default: words
        description: Search strategy (exact, words, leftWildcard, rightWildcard)
      pageSize:
        type: integer
        default: 10
        description: Results per page
      pageNumber:
        type: integer
        default: 1
        description: Page number
    response:
      format: json
      fields:
      - result.results[].ui
      - result.results[].name
      - result.results[].rootSource
      - result.results[].uri
    entity: ontology-term
  getConcept:
    description: Get concept details by UMLS Concept Unique Identifier (CUI)
    tags:
    - concept-info
    - concept-details
    method: GET
    path: /content/current/CUI/{cui}
    params:
      cui:
        type: string
        required: true
        description: UMLS CUI (e.g. C0011849 for diabetes mellitus)
    response:
      format: json
      fields:
      - result.ui
      - result.name
      - result.semanticTypes[].name
      - result.atomCount
      - result.definitions[].value
    entity: ontology-term
  getRelations:
    description: Get related concepts for a given CUI
    tags:
    - concept-relations
    - related-concepts
    method: GET
    path: /content/current/CUI/{cui}/relations
    params:
      cui:
        type: string
        required: true
        description: UMLS CUI
      pageSize:
        type: integer
        default: 25
    response:
      format: json
      fields:
      - result[].relatedIdName
      - result[].relationLabel
      - result[].additionalRelationLabel
      - result[].ui
      - result[].rootSource
    entity: ontology-term
  crosswalk:
    description: Get atoms (alternative names and source mappings) for a concept
    tags:
    - crosswalk
    - terminology-mapping
    - source-atoms
    method: GET
    path: /content/current/CUI/{cui}/atoms
    params:
      cui:
        type: string
        required: true
        description: UMLS CUI
      sabs:
        type: string
        description: Source vocabularies to filter (e.g. SNOMEDCT_US,ICD10CM,LNC)
      language:
        type: string
        default: ENG
        description: Language filter
      pageSize:
        type: integer
        default: 25
    response:
      format: json
      fields:
      - result[].name
      - result[].rootSource
      - result[].termType
      - result[].ui
      - result[].sourceConcept
    entity: ontology-term
tests:
  searchConcepts:
  - name: searches for diabetes
    params:
      query: diabetes
    assert:
    - path: result.results
      minLength: 1
    - path: result.results.0.ui
    allowError: true
  getConcept:
  - name: gets diabetes mellitus concept
    params:
      cui: C0011849
    assert:
    - path: result.ui
      equals: C0011849
    - path: result.name
    allowError: true
