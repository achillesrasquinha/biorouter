name: legumemine
displayName: LegumeMine
description: LegumeMine — InterMine for legume genomics covering soybean, common bean, and other legumes
tags:
  - legume
  - plant
  - soybean
  - intermine
  - agriculture
baseUrl: https://mines.legumeinfo.org/legumemine/service
tools:
  search:
    description: Search LegumeMine for legume genes, proteins, and genomic features
    tags:
      - legume-search
      - gene-search
    method: GET
    path: /search
    params:
      q:
        type: string
        required: true
        description: Search query (e.g. soybean, GmNARK, nodulation)
      format:
        type: string
        default: json
        description: Response format
      size:
        type: integer
        default: 10
        description: Number of results
    response:
      format: json
      fields:
        - totalHits
        - results[].id
        - results[].type
        - results[].fields
tests:
  search:
    - name: searches for soybean
      params:
        q: soybean
        format: json
        size: 3
      assert:
        - path: totalHits
        - path: results
          minLength: 1
