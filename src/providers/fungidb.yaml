name: fungidb
displayName: FungiDB
description: FungiDB — VEuPathDB resource for fungal genomics (Aspergillus, Candida, Cryptococcus, etc.)
tags:
- fungi
- pathogen
- veupathdb
- genomics
baseUrl: https://fungidb.org/fungidb/service
tools:
  listRecordTypes:
    description: List available record types in FungiDB
    tags:
    - record-types
    - metadata
    method: GET
    path: /record-types
    params: {}
    response:
      format: json
    entity: dataset
  search:
    description: Search FungiDB for fungal genes and genomic features
    tags:
    - gene-search
    - fungal-search
    method: GET
    path: /search
    params:
      q:
        type: string
        required: true
        description: Search query
      format:
        type: string
        default: json
        description: Response format
      size:
        type: integer
        default: 10
        description: Number of results
    response:
      format: json
    entity: gene
tests:
  listRecordTypes:
  - name: lists record types
    params: {}
    assert:
    - minLength: 1
