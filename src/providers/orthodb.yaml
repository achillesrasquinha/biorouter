name: orthodb
displayName: OrthoDB
description: Hierarchical catalog of orthologs — gene evolutionary relationships
tags:
- orthology
- evolution
- comparative-genomics
- orthodb
baseUrl: https://data.orthodb.org/v12
tools:
  search:
    description: Search orthologous groups by gene name
    tags:
    - ortholog-search
    - gene-search
    method: GET
    path: /search
    params:
      query:
        type: string
        required: true
        description: Gene name to search (e.g. "BRCA1", "insulin")
      level:
        type: integer
        default: 2759
        description: NCBI taxonomy level (2759=Eukaryota, 9606=Homo sapiens, 7742=Vertebrata)
      species:
        type: integer
        default: 9606
        description: NCBI taxonomy ID for species filter (9606=human)
    response:
      format: json
      fields:
      - status
      - data
    entity: gene
  getGroup:
    description: Get orthologous group details by OrthoDB group ID
    tags:
    - ortholog-group
    - group-info
    method: GET
    path: /group
    params:
      id:
        type: string
        required: true
        description: OrthoDB group ID (e.g. 733642at2759)
    response:
      format: json
      fields:
      - status
      - data.id
      - data.name
      - data.level_name
      - data.tax_id
      - data.evolutionary_rate
      - data.phyletic_profile.gene_count
      - data.phyletic_profile.species_count
      - data.interpro_domains[].description
    entity: gene
tests:
  search:
  - name: searches for BRCA1 orthologous groups
    params:
      query: BRCA1
    assert:
    - path: data
      minLength: 1
    - path: status
      equals: ok
  getGroup:
  - name: gets orthologous group details
    params:
      id: 733642at2759
    assert:
    - path: data.id
      equals: 733642at2759
    - path: data.name
