name: swisslipids
displayName: SwissLipids
description: SwissLipids — curated knowledge resource for lipid biology and lipidomics
tags:
- lipidomics
- lipids
- swisslipids
- metabolism
- fatty-acids
baseUrl: https://www.swisslipids.org/api
tools:
  search:
    description: Search SwissLipids for lipid entities by name or keyword
    tags:
    - lipid-search
    - lipidomics-search
    method: GET
    path: /search
    params:
      term:
        type: string
        required: true
        description: Search term (e.g. "cholesterol", "sphingomyelin")
    response:
      format: json
      fields:
      - '[].id'
      - '[].name'
      - '[].synonyms'
      - '[].formula'
      - '[].mass'
    entity: dataset
  getEntity:
    description: Get detailed lipid entity information by SwissLipids identifier
    tags:
    - lipid-detail
    - lipid-info
    method: GET
    path: /entity/{id}
    params:
      id:
        type: string
        required: true
        description: SwissLipids entity ID (e.g. SLM:000000224)
    response:
      format: json
      fields:
      - id
      - name
      - level
      - formula
      - mass
      - smiles
    entity: compound
tests:
  search:
  - name: searches for cholesterol
    params:
      term: cholesterol
    assert:
    - {}
  getEntity:
  - name: gets a lipid entity
    params:
      id: SLM:000000224
    assert:
    - {}
