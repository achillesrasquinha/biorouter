name: pubtator
displayName: PubTator
description: PubTator3 biomedical text mining — named entity recognition and annotation of PubMed articles
tags:
- text-mining
- ner
- annotation
- pubtator
- biomedical-nlp
baseUrl: https://www.ncbi.nlm.nih.gov/research/pubtator3-api
tools:
  annotateArticle:
    description: Get NER annotations for a PubMed article by PMID (returns BioC JSON)
    tags:
    - annotation
    - ner-annotation
    method: GET
    path: /publications/export/biocjson
    params:
      pmid:
        type: string
        required: true
        mapsTo: pmids
        description: PubMed ID (e.g. "35153516")
    response:
      format: json
      fields:
      - PubTator3[].pmid
      - PubTator3[].journal
      - PubTator3[].authors
      - PubTator3[].date
      - PubTator3[].passages[].text
      - PubTator3[].passages[].annotations[].text
      - PubTator3[].passages[].annotations[].infons.type
      - PubTator3[].passages[].annotations[].infons.identifier
    entity: annotation
  search:
    description: Search PubTator for annotated articles by text query
    tags:
    - article-search
    - entity-search
    method: GET
    path: /search/
    params:
      query:
        type: string
        required: true
        mapsTo: text
        description: Search text (e.g. "BRCA1 cancer")
      sort:
        type: string
        default: score desc
        description: Sort order (e.g. "score desc", "date desc")
    response:
      format: json
      fields:
      - results[].pmid
      - results[].title
      - results[].journal
      - results[].authors
      - results[].date
      - results[].doi
      - results[].score
    entity: publication
tests:
  annotateArticle:
  - name: annotates PMID 35153516
    params:
      pmid: '35153516'
    assert:
    - path: PubTator3
      minLength: 1
  search:
  - name: searches for BRCA1 cancer
    params:
      query: BRCA1 cancer
    assert:
    - path: results
      minLength: 1
