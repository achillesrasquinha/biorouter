name: classyfire
displayName: ClassyFire
description: Automated chemical classification using the ChemOnt ontology
tags:
- chemistry
- classification
- chemical-taxonomy
- chemont
- metabolites
baseUrl: http://classyfire.wishartlab.com
tools:
  classify:
    description: Classify a chemical compound by InChIKey
    tags:
    - chemical-classification
    - compound-info
    method: GET
    path: /entities/{inchikey}.json
    params:
      inchikey:
        type: string
        required: true
        description: InChIKey of the compound (e.g. BSYNRYMUTXBXSQ-UHFFFAOYSA-N for aspirin)
    response:
      format: json
      fields:
      - inchikey
      - smiles
      - kingdom.name
      - superclass.name
      - class.name
      - subclass.name
      - direct_parent.name
      - molecular_framework
      - description
    entity: ontology-term
tests:
  classify:
  - name: classifies aspirin by InChIKey
    params:
      inchikey: BSYNRYMUTXBXSQ-UHFFFAOYSA-N
    assert:
    - path: inchikey
    - path: kingdom.name
    allowError: true
