name: dbsnp
displayName: dbSNP
description: Database of single nucleotide polymorphisms and other genetic variation
tags:
- snp
- variants
- polymorphisms
- ncbi
- genetic-variation
baseUrl: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
tools:
  search:
    description: Search dbSNP for genetic variants by rsID or keyword
    tags:
    - snp-search
    - variant-search
    method: GET
    path: /esearch.fcgi
    params:
      query:
        type: string
        required: true
        mapsTo: term
        description: Search query (e.g. "rs7412", "APOE missense")
      maxResults:
        type: integer
        default: 10
        mapsTo: retmax
      db:
        type: string
        default: snp
      retmode:
        type: string
        default: json
    response:
      format: json
      fields:
      - esearchresult.count
      - esearchresult.idlist
      - esearchresult.querytranslation
    entity: gene
  getSummary:
    description: Get SNP summary information by dbSNP ID
    tags:
    - snp-info
    - variant-info
    method: GET
    path: /esummary.fcgi
    params:
      id:
        type: string
        required: true
        description: dbSNP numeric ID (e.g. "7412" for rs7412)
      db:
        type: string
        default: snp
      retmode:
        type: string
        default: json
    response:
      format: json
    entity: gene
tests:
  search:
  - name: searches for rs7412 variant
    params:
      query: rs7412
    assert:
    - path: esearchresult.idlist
      minLength: 1
  getSummary:
  - name: gets SNP summary for rs7412
    params:
      id: '7412'
    assert:
    - path: result.7412
