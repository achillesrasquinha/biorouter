name: proteomexchange
displayName: ProteomeXchange
description: ProteomeXchange — centralized proteomics dataset repository linking PRIDE, MassIVE, and other archives
tags:
  - proteomics
  - mass-spectrometry
  - datasets
  - proteomexchange
baseUrl: https://proteomecentral.proteomexchange.org/cgi
tools:
  getDataset:
    description: Get proteomics dataset details by ProteomeXchange ID
    tags:
      - dataset-info
      - proteomics-data
    method: GET
    path: /GetDataset
    params:
      ID:
        type: string
        required: true
        description: ProteomeXchange ID (e.g. PXD000001, PXD010154)
      outputMode:
        type: string
        default: json
        description: Output format
    response:
      format: json
      fields:
        - title
        - description
        - species[].name
        - instruments[].name
        - keywords
        - contacts[].terms
        - publications
        - identifiers
tests:
  getDataset:
    - name: gets proteomics dataset
      params:
        ID: PXD000001
        outputMode: json
      assert:
        - path: title
        - path: description
