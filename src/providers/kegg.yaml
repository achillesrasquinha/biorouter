name: kegg
displayName: KEGG
description: Kyoto Encyclopedia of Genes and Genomes — pathway and molecular interaction database
tags:
  - pathway
  - gene
  - compound
  - metabolism
  - kegg
baseUrl: https://rest.kegg.jp
tools:
  searchGenes:
    description: Search KEGG for genes matching a keyword
    tags:
      - gene-search
      - kegg-search
    method: GET
    path: /find/genes/{query}
    params:
      query:
        type: string
        required: true
        description: Search term (e.g. "insulin human", "CYP3A4")
    response:
      format: tsv
      columns:
        - id
        - description
      fields:
        - "[].id"
        - "[].description"
  searchDrugs:
    description: Search KEGG for drugs by name
    tags:
      - drug-search
      - kegg-drug
    method: GET
    path: /find/drug/{query}
    params:
      query:
        type: string
        required: true
        description: Drug name (e.g. "metformin", "atorvastatin")
    response:
      format: tsv
      columns:
        - id
        - description
      fields:
        - "[].id"
        - "[].description"
  searchCompounds:
    description: Search KEGG for chemical compounds by name
    tags:
      - compound-search
      - kegg-compound
    method: GET
    path: /find/compound/{query}
    params:
      query:
        type: string
        required: true
        description: Compound name (e.g. "amlodipine", "glucose")
    response:
      format: tsv
      columns:
        - id
        - description
      fields:
        - "[].id"
        - "[].description"
  searchPathways:
    description: Search KEGG for pathways by keyword
    tags:
      - pathway-search
      - kegg-pathway
    method: GET
    path: /find/pathway/{query}
    params:
      query:
        type: string
        required: true
        description: Pathway keyword (e.g. "drug metabolism cytochrome", "glycolysis")
    response:
      format: tsv
      columns:
        - id
        - description
      fields:
        - "[].id"
        - "[].description"
  getEntry:
    description: Get a KEGG database entry by ID (gene, drug, compound, pathway, enzyme)
    tags:
      - entry-info
      - kegg-entry
    method: GET
    path: /get/{entryId}
    params:
      entryId:
        type: string
        required: true
        description: KEGG entry ID (e.g. "hsa:3630", "dr:D00944", "cpd:C07151", "map00982", "ec:1.14.14.1")
    response:
      format: keyvalue
      fields:
        - ENTRY
        - NAME
        - FORMULA
        - MOL_WEIGHT
        - EFFICACY
        - TARGET
        - METABOLISM
        - PATHWAY
        - ORTHOLOGY
        - ORGANISM
        - DBLINKS
  getLinked:
    description: Find cross-references between KEGG databases (e.g. drug→enzyme, compound→pathway)
    tags:
      - cross-reference
      - kegg-link
    method: GET
    path: /link/{targetDb}/{sourceId}
    params:
      targetDb:
        type: string
        required: true
        description: Target database (e.g. "enzyme", "pathway", "compound", "drug", "genes")
      sourceId:
        type: string
        required: true
        description: Source entry ID (e.g. "dr:D00944", "cpd:C07151", "hsa:1576")
    response:
      format: tsv
      columns:
        - source
        - target
      fields:
        - "[].source"
        - "[].target"
  getPathway:
    description: Get a KEGG pathway entry by pathway ID
    tags:
      - pathway-info
      - kegg-pathway-detail
    method: GET
    path: /get/{pathwayId}
    params:
      pathwayId:
        type: string
        required: true
        description: KEGG pathway ID (e.g. "hsa00010", "map00010")
    response:
      format: keyvalue
      fields:
        - ENTRY
        - NAME
        - DESCRIPTION
        - CLASS
        - PATHWAY_MAP
        - ORGANISM
        - GENE
        - COMPOUND
  listPathways:
    description: List all pathways for an organism
    tags:
      - pathway-list
      - kegg-pathway-list
    method: GET
    path: /list/pathway/{org}
    params:
      org:
        type: string
        required: true
        description: Organism code (e.g. "hsa" for human, "mmu" for mouse)
    response:
      format: tsv
      columns:
        - id
        - description
      fields:
        - "[].id"
        - "[].description"
  getCompound:
    description: Get a KEGG compound entry by compound ID
    tags:
      - compound-info
      - kegg-compound-detail
    method: GET
    path: /get/{compoundId}
    params:
      compoundId:
        type: string
        required: true
        description: KEGG compound ID (e.g. "cpd:C00031" for glucose)
    response:
      format: keyvalue
      fields:
        - ENTRY
        - NAME
        - FORMULA
        - EXACT_MASS
        - MOL_WEIGHT
        - PATHWAY
        - ENZYME
        - DBLINKS
tests:
  searchGenes:
    - name: searches for insulin genes
      params:
        query: insulin
      assert:
        - isArray: true
        - path: 0.id
  searchDrugs:
    - name: searches for metformin drug
      params:
        query: metformin
      assert:
        - isArray: true
        - path: 0.id
  searchPathways:
    - name: searches for drug metabolism pathways
      params:
        query: drug metabolism cytochrome
      assert:
        - isArray: true
        - path: 0.id
  getEntry:
    - name: gets KEGG entry for human insulin gene
      params:
        entryId: hsa:3630
      assert:
        - path: ENTRY
  getPathway:
    - name: gets KEGG pathway for glycolysis
      params:
        pathwayId: hsa00010
      assert:
        - path: ENTRY
  listPathways:
    - name: lists human pathways
      params:
        org: hsa
      assert:
        - isArray: true
        - path: 0.id
  getCompound:
    - name: gets KEGG compound for glucose
      params:
        compoundId: cpd:C00031
      assert:
        - path: ENTRY
