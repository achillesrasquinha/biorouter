name: iucn
displayName: IUCN Red List
description: IUCN Red List of Threatened Species — conservation status for 150,000+ species
tags: [conservation, endangered-species, biodiversity, ecology, iucn, red-list]
baseUrl: https://apiv3.iucnredlist.org/api/v3

auth:
  type: apiKey
  param: token
  env: LS_IUCN_API_KEY

tools:
  searchSpecies:
    description: Search species by name on the IUCN Red List
    tags: [species-search, conservation-search]
    method: GET
    path: /species/search/{query}
    params:
      query:
        type: string
        required: true
        description: Species common or scientific name (e.g. "tiger", "Panthera tigris")
    response:
      format: json
      fields:
        - result[].taxonid
        - result[].scientific_name
        - result[].kingdom
        - result[].phylum
        - result[].class
        - result[].order
        - result[].family
        - result[].category

  getSpecies:
    description: Get conservation details for a species by name
    tags: [species-info, conservation-status]
    method: GET
    path: /species/{name}
    params:
      name:
        type: string
        required: true
        description: Scientific name (e.g. Panthera tigris, Gorilla gorilla)
    response:
      format: json
      fields:
        - result[].taxonid
        - result[].scientific_name
        - result[].category
        - result[].main_common_name
        - result[].population_trend

  getThreats:
    description: Get threats facing a species
    tags: [threat-assessment, conservation-threats]
    method: GET
    path: /threats/species/name/{name}
    params:
      name:
        type: string
        required: true
        description: Scientific name (e.g. Panthera tigris)
    response:
      format: json
      fields:
        - result[].code
        - result[].title
        - result[].timing
        - result[].scope
        - result[].severity
        - result[].score

  getConservationActions:
    description: Get conservation measures for a species
    tags: [conservation-actions, protection-measures]
    method: GET
    path: /measures/species/name/{name}
    params:
      name:
        type: string
        required: true
        description: Scientific name (e.g. Panthera tigris)
    response:
      format: json
      fields:
        - result[].code
        - result[].title

  getCountryOccurrences:
    description: Get countries where a species occurs
    tags: [species-distribution, country-occurrence]
    method: GET
    path: /species/countries/name/{name}
    params:
      name:
        type: string
        required: true
        description: Scientific name
    response:
      format: json
      fields:
        - result[].country
        - result[].presence
        - result[].origin
        - result[].distribution_code

  getSpeciesNarrative:
    description: Get species narrative including habitat, threats, and population info
    tags: [species-narrative, conservation-narrative]
    method: GET
    path: /species/narrative/{name}
    params:
      name:
        type: string
        required: true
        description: Scientific name (e.g. Panthera tigris)
    response:
      format: json
      fields:
        - result[].habitat
        - result[].threats
        - result[].population

  getSpeciesByCountry:
    description: Get species list for a specific country
    tags: [species-by-country, country-biodiversity]
    method: GET
    path: /country/getspecies/{isoCode}
    params:
      isoCode:
        type: string
        required: true
        description: ISO country code (e.g. US, BR, KE)
    response:
      format: json
      fields:
        - result[].scientific_name
        - result[].category
        - result[].count

tests:
  searchSpecies:
    - name: searches for tiger
      params:
        query: tiger
      assert:
        - path: result
          minLength: 1
      allowError: true
  getSpecies:
    - name: gets Panthera tigris conservation status
      params:
        name: Panthera tigris
      assert:
        - path: result
          minLength: 1
      allowError: true
  getSpeciesNarrative:
    - name: gets narrative for Panthera tigris
      params:
        name: Panthera tigris
      assert:
        - path: result
          minLength: 1
      allowError: true
  getSpeciesByCountry:
    - name: gets species for US
      params:
        isoCode: US
      assert:
        - path: result
          minLength: 1
      allowError: true
