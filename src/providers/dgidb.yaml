name: dgidb
displayName: DGIdb
description: Drug-Gene Interaction Database — mining drug-gene interaction data
tags:
  - drug
  - gene
  - interaction
  - pharmacogenomics
  - druggable-genome
baseUrl: https://dgidb.org/api/graphql
protocol: graphql
tools:
  search:
    description: Search for drug-gene interactions by gene name
    tags:
      - drug-gene-search
      - interaction-search
    query: |
      query ($names: [String!]!) {
        genes(names: $names) {
          nodes {
            name
            longName
            interactions {
              drug { name conceptId }
              interactionTypes { type directionality }
              evidenceScore
            }
          }
        }
      }
    params:
      names:
        type: array
        required: true
        description: Gene name(s) to search for interactions (e.g. ["EGFR"])
    response:
      format: json
      fields:
        - "genes.nodes[].name"
        - "genes.nodes[].longName"
        - "genes.nodes[].interactions[].drug.name"
        - "genes.nodes[].interactions[].drug.conceptId"
        - "genes.nodes[].interactions[].interactionTypes[].type"
        - "genes.nodes[].interactions[].interactionTypes[].directionality"
        - "genes.nodes[].interactions[].evidenceScore"
  getGene:
    description: Get gene details including drug interactions
    tags:
      - gene-info
      - drug-gene-info
    query: |
      query ($names: [String!]!) {
        genes(names: $names) {
          nodes {
            name
            longName
            geneCategories { name }
            interactions {
              drug { name conceptId }
              evidenceScore
            }
          }
        }
      }
    params:
      names:
        type: array
        required: true
        description: Gene name(s) to look up (e.g. ["EGFR"])
    response:
      format: json
      fields:
        - "genes.nodes[].name"
        - "genes.nodes[].longName"
        - "genes.nodes[].geneCategories[].name"
        - "genes.nodes[].interactions[].drug.name"
        - "genes.nodes[].interactions[].drug.conceptId"
        - "genes.nodes[].interactions[].evidenceScore"
  getCategories:
    description: Get gene categories for a gene
    tags:
      - gene-categories
      - druggable-genome
    query: |
      query ($names: [String!]!) {
        genes(names: $names) {
          nodes {
            name
            geneCategories { name }
          }
        }
      }
    params:
      names:
        type: array
        required: true
        description: Gene name(s) to look up categories (e.g. ["EGFR"])
    response:
      format: json
      fields:
        - "genes.nodes[].name"
        - "genes.nodes[].geneCategories[].name"
  getDrugApplications:
    description: Get drug details and application information
    tags:
      - drug-info
      - drug-applications
    query: |
      query ($names: [String!]!) {
        drugs(names: $names) {
          nodes {
            name
            conceptId
            approved
            drugApplications { appNo }
          }
        }
      }
    params:
      names:
        type: array
        required: true
        description: Drug name(s) to look up (e.g. ["ERLOTINIB"])
    response:
      format: json
      fields:
        - "drugs.nodes[].name"
        - "drugs.nodes[].conceptId"
        - "drugs.nodes[].approved"
        - "drugs.nodes[].drugApplications[].appNo"
tests:
  search:
    - name: searches for EGFR drug-gene interactions
      params:
        names:
          - EGFR
      assert:
        - path: genes.nodes
          minLength: 1
        - path: genes.nodes.0.interactions
          minLength: 1
  getGene:
    - name: gets gene details for BRAF
      params:
        names:
          - BRAF
      assert:
        - path: genes.nodes
          minLength: 1
        - path: genes.nodes.0.name
          equals: BRAF
  getCategories:
    - name: gets gene categories for EGFR
      params:
        names:
          - EGFR
      assert:
        - path: genes.nodes
          minLength: 1
        - path: genes.nodes.0.geneCategories
          minLength: 1
  getDrugApplications:
    - name: gets drug info for ERLOTINIB
      params:
        names:
          - ERLOTINIB
      assert:
        - path: drugs.nodes
          minLength: 1
