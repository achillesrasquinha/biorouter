name: dgidb
displayName: DGIdb
description: Drug-Gene Interaction Database — mining drug-gene interaction data
tags:
- drug
- gene
- interaction
- pharmacogenomics
- druggable-genome
baseUrl: https://dgidb.org/api/graphql
protocol: graphql
tools:
  search:
    description: Search for drug-gene interactions by gene name
    tags:
    - drug-gene-search
    - interaction-search
    query: "query ($names: [String!]!) {\n  genes(names: $names) {\n    nodes {\n      name\n      longName\n      interactions\
      \ {\n        drug { name conceptId }\n        interactionTypes { type directionality }\n        evidenceScore\n    \
      \  }\n    }\n  }\n}\n"
    params:
      names:
        type: array
        required: true
        description: Gene name(s) to search for interactions (e.g. ["EGFR"])
    response:
      format: json
      fields:
      - genes.nodes[].name
      - genes.nodes[].longName
      - genes.nodes[].interactions[].drug.name
      - genes.nodes[].interactions[].drug.conceptId
      - genes.nodes[].interactions[].interactionTypes[].type
      - genes.nodes[].interactions[].interactionTypes[].directionality
      - genes.nodes[].interactions[].evidenceScore
    entity: gene
  getGene:
    description: Get gene details including drug interactions
    tags:
    - gene-info
    - drug-gene-info
    query: "query ($names: [String!]!) {\n  genes(names: $names) {\n    nodes {\n      name\n      longName\n      geneCategories\
      \ { name }\n      interactions {\n        drug { name conceptId }\n        evidenceScore\n      }\n    }\n  }\n}\n"
    params:
      names:
        type: array
        required: true
        description: Gene name(s) to look up (e.g. ["EGFR"])
    response:
      format: json
      fields:
      - genes.nodes[].name
      - genes.nodes[].longName
      - genes.nodes[].geneCategories[].name
      - genes.nodes[].interactions[].drug.name
      - genes.nodes[].interactions[].drug.conceptId
      - genes.nodes[].interactions[].evidenceScore
    entity: gene
  getCategories:
    description: Get gene categories for a gene
    tags:
    - gene-categories
    - druggable-genome
    query: "query ($names: [String!]!) {\n  genes(names: $names) {\n    nodes {\n      name\n      geneCategories { name }\n\
      \    }\n  }\n}\n"
    params:
      names:
        type: array
        required: true
        description: Gene name(s) to look up categories (e.g. ["EGFR"])
    response:
      format: json
      fields:
      - genes.nodes[].name
      - genes.nodes[].geneCategories[].name
    entity: gene
  getDrugApplications:
    description: Get drug details and application information
    tags:
    - drug-info
    - drug-applications
    query: "query ($names: [String!]!) {\n  drugs(names: $names) {\n    nodes {\n      name\n      conceptId\n      approved\n\
      \      drugApplications { appNo }\n    }\n  }\n}\n"
    params:
      names:
        type: array
        required: true
        description: Drug name(s) to look up (e.g. ["ERLOTINIB"])
    response:
      format: json
      fields:
      - drugs.nodes[].name
      - drugs.nodes[].conceptId
      - drugs.nodes[].approved
      - drugs.nodes[].drugApplications[].appNo
    entity: compound
tests:
  search:
  - name: searches for EGFR drug-gene interactions
    params:
      names:
      - EGFR
    assert:
    - path: genes.nodes
      minLength: 1
    - path: genes.nodes.0.interactions
      minLength: 1
  getGene:
  - name: gets gene details for BRAF
    params:
      names:
      - BRAF
    assert:
    - path: genes.nodes
      minLength: 1
    - path: genes.nodes.0.name
      equals: BRAF
  getCategories:
  - name: gets gene categories for EGFR
    params:
      names:
      - EGFR
    assert:
    - path: genes.nodes
      minLength: 1
    - path: genes.nodes.0.geneCategories
      minLength: 1
  getDrugApplications:
  - name: gets drug info for ERLOTINIB
    params:
      names:
      - ERLOTINIB
    assert:
    - path: drugs.nodes
      minLength: 1
