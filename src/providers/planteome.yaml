name: planteome
displayName: Planteome
description: Planteome — plant trait ontologies and gene annotations for plant biology
tags:
- plant-biology
- ontology
- traits
- annotation
- planteome
baseUrl: https://planteome.org/api
tools:
  searchTraits:
    description: Search Planteome for plant traits by keyword and category
    tags:
    - trait-search
    - ontology-search
    method: GET
    path: /search
    params:
      q:
        type: string
        required: true
        description: Search query for plant traits (e.g. "drought tolerance")
      category:
        type: string
        default: trait
        description: Category to search within (trait, gene, germplasm)
    response:
      format: json
    entity: phenotype
  getAnnotation:
    description: Get a specific annotation record by its identifier
    tags:
    - annotation-detail
    - ontology-detail
    method: GET
    path: /annotation/{id}
    params:
      id:
        type: string
        required: true
        description: Planteome annotation identifier
    response:
      format: json
    entity: annotation
tests:
  searchTraits:
  - name: searches for drought tolerance traits
    params:
      q: drought tolerance
      category: trait
    assert:
    - {}
    allowError: true
  getAnnotation:
  - name: gets annotation by ID
    params:
      id: PO:0009025
    assert:
    - {}
    allowError: true
