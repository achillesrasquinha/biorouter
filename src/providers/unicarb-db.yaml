name: unicarb-db
displayName: UniCarb-DB
description: UniCarb-DB — glycan structure database with experimentally determined carbohydrate structures
tags:
- glycan
- carbohydrate
- structure
- mass-spectrometry
- unicarb
baseUrl: https://unicarb-db.expasy.org/api
tools:
  search:
    description: Search UniCarb-DB for glycan structures by keyword or composition
    tags:
    - glycan-search
    - structure-search
    method: GET
    path: /structures
    params:
      query:
        type: string
        required: true
        description: Search term for glycan structures (e.g. "Hex5HexNAc4")
    response:
      format: json
    entity: structure
  getStructure:
    description: Get detailed information for a specific glycan structure by ID
    tags:
    - structure-detail
    - glycan-detail
    method: GET
    path: /structures/{id}
    params:
      id:
        type: integer
        required: true
        description: UniCarb-DB structure identifier
    response:
      format: json
    entity: structure
tests:
  search:
  - name: searches for glycan structures
    params:
      query: Hex5HexNAc4
    assert:
    - {}
    allowError: true
  getStructure:
  - name: gets structure by ID
    params:
      id: 1
    assert:
    - {}
    allowError: true
