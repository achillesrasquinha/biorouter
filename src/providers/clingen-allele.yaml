name: clingen-allele
displayName: ClinGen Allele Registry
description: ClinGen Allele Registry — canonical allele identifiers linking variants across nomenclatures
tags:
- variant
- allele
- clinical-genetics
- clingen
- nomenclature
baseUrl: https://reg.clinicalgenome.org
tools:
  lookupByHGVS:
    description: Look up a variant allele by HGVS expression
    tags:
    - variant-lookup
    - hgvs
    method: GET
    path: /allele
    params:
      hgvs:
        type: string
        required: true
        description: HGVS expression (e.g. NC_000007.14:g.140753336A>T for BRAF V600E)
    response:
      format: json
      fields:
      - '@id'
      - communityStandardTitle
      - genomicAlleles[].referenceGenome
      - genomicAlleles[].chromosome
      - genomicAlleles[].coordinates[].start
      - genomicAlleles[].coordinates[].end
      - externalRecords
    entity: variant
  lookupById:
    description: Look up an allele by ClinGen canonical allele ID
    tags:
    - allele-lookup
    - canonical-id
    method: GET
    path: /allele/{alleleId}
    params:
      alleleId:
        type: string
        required: true
        description: ClinGen allele ID (e.g. CA123643)
    response:
      format: json
      fields:
      - '@id'
      - communityStandardTitle
      - genomicAlleles[].referenceGenome
      - externalRecords
    entity: identifier
tests:
  lookupByHGVS:
  - name: looks up BRAF V600E variant
    params:
      hgvs: NC_000007.14:g.140753336A>T
    assert:
    - path: communityStandardTitle
    - path: externalRecords
