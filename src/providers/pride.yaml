name: pride
displayName: PRIDE
description: PRIDE proteomics archive — mass spectrometry proteomics data repository
tags:
- proteomics
- mass-spectrometry
- pride
- peptides
baseUrl: https://www.ebi.ac.uk/pride/ws/archive/v2
tools:
  searchProjects:
    description: Search PRIDE proteomics projects by keyword
    tags:
    - project-search
    - proteomics-search
    method: GET
    path: /search/autocomplete
    params:
      query:
        type: string
        required: true
        mapsTo: keyword
        description: Search keyword (e.g. "cancer", "phosphoproteomics")
      limit:
        type: integer
        default: 10
        description: Maximum number of results
    response:
      format: json
    entity: dataset
  getProject:
    description: Get a specific PRIDE project by accession
    tags:
    - project-info
    - dataset-info
    method: GET
    path: /projects/{accession}
    params:
      accession:
        type: string
        required: true
        description: PRIDE project accession (e.g. PXD000001)
    response:
      format: json
      fields:
      - accession
      - title
      - projectDescription
      - submissionType
      - submissionDate
      - publicationDate
      - keywords
      - instruments[].name
      - submitters[].name
      - countries
    entity: dataset
  getProjectFiles:
    description: Get files associated with a PRIDE project
    tags:
    - project-files
    - dataset-files
    method: GET
    path: /projects/{accession}/files
    params:
      accession:
        type: string
        required: true
        description: PRIDE project accession (e.g. PXD000001)
      pageSize:
        type: integer
        default: 10
        description: Number of files to return per page
    response:
      format: json
      fields:
      - '[].fileName'
      - '[].fileSizeBytes'
      - '[].fileCategory.value'
      - '[].projectAccessions'
    entity: dataset
tests:
  searchProjects:
  - name: searches projects for cancer
    params:
      query: cancer
    assert:
    - isArray: true
  getProject:
  - name: gets project PXD000001
    params:
      accession: PXD000001
    assert:
    - path: accession
      equals: PXD000001
    - path: title
  getProjectFiles:
  - name: gets files for project PXD000001
    params:
      accession: PXD000001
    assert:
    - {}
    allowError: true
