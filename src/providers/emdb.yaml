name: emdb
displayName: EMDB
description: Electron Microscopy Data Bank — 3D cryo-EM density maps and tomograms
tags:
- electron-microscopy
- structure
- emdb
- cryoem
- 3d-reconstruction
baseUrl: https://www.ebi.ac.uk/emdb/api
tools:
  search:
    description: Search EMDB for electron microscopy entries by keyword
    tags:
    - em-search
    - structure-search
    method: GET
    path: /search/*{query}
    params:
      query:
        type: string
        required: true
        description: Search query (e.g. ribosome, virus, membrane)
      rows:
        type: integer
        default: 10
        description: Number of results to return
    response:
      format: json
      fields:
      - '[].emdb_id'
      - '[].admin.title'
      - '[].admin.key_dates.deposition'
      - '[].admin.key_dates.map_release'
      - '[].admin.current_status.code.valueOf_'
      - '[].admin.keywords'
    entity: dataset
  getEntry:
    description: Get a specific EMDB entry by ID
    tags:
    - entry-info
    - em-detail
    method: GET
    path: /entry/{id}
    params:
      id:
        type: string
        required: true
        description: EMDB entry ID (e.g. EMD-1234)
    response:
      format: json
      fields:
      - emdb_id
      - admin.title
      - admin.key_dates.deposition
      - admin.key_dates.map_release
      - admin.keywords
      - admin.current_status.code.valueOf_
      - sample
      - map
    entity: dataset
tests:
  search:
  - name: searches for ribosome entries
    params:
      query: ribosome
    assert:
    - isArray: true
  getEntry:
  - name: gets entry EMD-1234
    params:
      id: EMD-1234
    assert:
    - {}
    - anyOf:
      - admin
      - _id
