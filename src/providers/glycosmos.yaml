name: glycosmos
displayName: GlyCosmos
description: GlyCosmos — integrated glycoscience portal for glycan structures, pathways, and diseases
tags:
- glycoscience
- glycan
- carbohydrate
- pathway
- glycosmos
baseUrl: https://glycosmos.org/api
tools:
  searchGlycans:
    description: Search GlyCosmos for glycan structures by keyword or motif
    tags:
    - glycan-search
    - carbohydrate-search
    method: GET
    path: /glycan/search
    params:
      query:
        type: string
        required: true
        description: Search term for glycans (e.g. "sialyl Lewis x", "N-glycan")
    response:
      format: json
    entity: compound
  getPathway:
    description: Get glycan biosynthesis or metabolic pathway by ID
    tags:
    - pathway-detail
    - glycan-pathway
    method: GET
    path: /pathway/{id}
    params:
      id:
        type: string
        required: true
        description: GlyCosmos pathway identifier
    response:
      format: json
    entity: pathway
tests:
  searchGlycans:
  - name: searches for N-glycan structures
    params:
      query: N-glycan
    assert:
    - {}
    allowError: true
  getPathway:
  - name: gets a glycan pathway
    params:
      id: R-HSA-446203
    assert:
    - {}
    allowError: true
