name: wormbase
displayName: WormBase
description: WormBase C. elegans and nematode genomics via the Alliance of Genome Resources API
tags:
  - c-elegans
  - model-organism
  - wormbase
  - nematode
  - genetics
baseUrl: https://www.alliancegenome.org/api
tools:
  getGene:
    description: Get detailed gene information from WormBase by gene ID (e.g. WB:WBGene00006763 for unc-26)
    tags:
      - gene-info
      - gene-detail
    method: GET
    path: /gene/{geneId}
    params:
      geneId:
        type: string
        required: true
        description: Alliance gene ID with WB prefix (e.g. WB:WBGene00006763)
    response:
      format: json
      fields:
        - gene.primaryExternalId
        - gene.symbol
        - gene.taxon.name
        - gene.dataProvider.abbreviation
        - gene.relatedNotes[].freeText
        - gene.relatedNotes[].noteType.name
  searchGene:
    description: Search WormBase genes by name or keyword via autocomplete
    tags:
      - gene-search
      - name-search
    method: GET
    path: /search_autocomplete
    params:
      query:
        type: string
        required: true
        mapsTo: q
        description: Gene name or keyword to search (e.g. "unc-26", "daf-2")
      limit:
        type: integer
        default: 5
        description: Number of results to return
    response:
      format: json
      fields:
        - results[].symbol
        - results[].curie
        - results[].name
        - results[].category
  getProtein:
    description: Get protein information for a gene from the Alliance of Genome Resources
    tags:
      - protein-info
      - gene-protein
    method: GET
    path: /gene/{geneId}/homologs
    params:
      geneId:
        type: string
        required: true
        description: Alliance gene ID with WB prefix (e.g. WB:WBGene00006763)
    response:
      format: json
      fields:
        - results[].gene.symbol
        - results[].homologGene.symbol
        - results[].homologGene.species.name
tests:
  getGene:
    - name: gets gene detail for unc-26 (WB:WBGene00006763)
      params:
        geneId: WB:WBGene00006763
      assert:
        - path: gene
        - path: gene.primaryExternalId
  searchGene:
    - name: searches for unc-26 via autocomplete
      params:
        query: unc-26
      assert:
        - path: results
          minLength: 1
  getProtein:
    - name: gets protein/homolog info for unc-26 (WB:WBGene00006763)
      params:
        geneId: WB:WBGene00006763
      assert:
        - {}
      allowError: true
