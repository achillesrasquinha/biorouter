name: gtdb
displayName: GTDB
description: Genome Taxonomy Database — standardized bacterial and archaeal taxonomy based on genome phylogeny
tags:
- taxonomy
- genome
- bacteria
- archaea
- gtdb
baseUrl: https://gtdb-api.ecogenomic.org
tools:
  search:
    description: Search GTDB for bacterial or archaeal genomes
    tags:
    - genome-search
    - taxonomy-search
    method: GET
    path: /search/gtdb
    params:
      search:
        type: string
        required: true
        description: Search query (e.g. organism name, accession)
      page:
        type: integer
        default: 1
        description: Page number for paginated results
      itemsPerPage:
        type: integer
        default: 10
        description: Number of results per page
    response:
      format: json
      fields:
      - rows[].gid
      - rows[].accession
      - rows[].ncbiOrgName
      - rows[].ncbiTaxonomy
      - rows[].gtdbTaxonomy
      - rows[].isGtdbSpeciesRep
      - rows[].isTypeSpecies
    entity: dataset
  getTaxon:
    description: Get taxonomic details by GTDB ID
    tags:
    - taxon-details
    - taxonomy
    method: GET
    path: /taxon/{taxon}
    params:
      taxon:
        type: string
        required: true
        description: GTDB taxon identifier
    response:
      format: json
    entity: organism
tests:
  search:
  - name: searches for Escherichia coli genomes
    params:
      search: Escherichia coli
    assert:
    - path: rows
      minLength: 1
    - path: rows.0.accession
  getTaxon:
  - name: gets taxon details for a GTDB species
    params:
      taxon: s__Escherichia coli
    assert:
    - minLength: 1
    - path: 0.taxon
