name: clinical-tables
displayName: NLM Clinical Tables
description: NLM Clinical Tables — autocomplete and lookup for ICD-10, LOINC, RxTerms, SNOMED, and conditions
tags:
- clinical
- icd
- loinc
- rxterms
- terminology
- nlm
baseUrl: https://clinicaltables.nlm.nih.gov/api
tools:
  searchConditions:
    description: Search for medical conditions and diseases
    tags:
    - condition-search
    - disease-search
    method: GET
    path: /conditions/v3/search
    params:
      terms:
        type: string
        required: true
        description: Search terms (e.g. diabetes, heart failure, cancer)
      maxList:
        type: integer
        default: 10
        description: Maximum results
    response:
      format: json
    entity: disease
  searchICD10:
    description: Search ICD-10-CM codes by name or code
    tags:
    - icd10
    - diagnosis-code
    method: GET
    path: /icd10cm/v3/search
    params:
      sf:
        type: string
        default: code,name
        description: Search fields
      terms:
        type: string
        required: true
        description: Search terms (e.g. diabetes, E11)
      maxList:
        type: integer
        default: 10
        description: Maximum results
    response:
      format: json
    entity: ontology-term
  searchLOINC:
    description: Search LOINC laboratory test codes
    tags:
    - loinc
    - lab-test
    method: GET
    path: /loinc_items/v3/search
    params:
      terms:
        type: string
        required: true
        description: Search terms (e.g. glucose, hemoglobin, cholesterol)
      maxList:
        type: integer
        default: 10
        description: Maximum results
    response:
      format: json
    entity: ontology-term
  searchRxTerms:
    description: Search for drug names and formulations
    tags:
    - drug-search
    - rxterms
    method: GET
    path: /rxterms/v3/search
    params:
      terms:
        type: string
        required: true
        description: Drug name (e.g. aspirin, metformin, lisinopril)
      maxList:
        type: integer
        default: 10
        description: Maximum results
    response:
      format: json
    entity: ontology-term
tests:
  searchConditions:
  - name: searches for diabetes conditions
    params:
      terms: diabetes
      maxList: 5
    assert:
    - minLength: 2
  searchICD10:
  - name: searches for diabetes ICD-10 codes
    params:
      sf: code,name
      terms: diabetes
      maxList: 5
    assert:
    - minLength: 2
