name: vertnet
displayName: VertNet
description: VertNet — vertebrate specimen records from natural history collections worldwide
tags:
- vertebrates
- specimens
- natural-history
- collections
- biodiversity
baseUrl: http://api.vertnet-portal.appspot.com/api
tools:
  search:
    description: Search VertNet for vertebrate specimen records
    tags:
    - specimen-search
    - occurrence-search
    method: GET
    path: /search
    params:
      q:
        type: string
        required: true
        description: Search query (e.g. "Ursus arctos", "salamander Colorado")
      limit:
        type: integer
        default: 10
        description: Maximum number of results to return
    response:
      format: json
    entity: sample
  getSpecimen:
    description: Get a specific VertNet specimen record by ID
    tags:
    - specimen-detail
    - record-lookup
    method: GET
    path: /record/{id}
    params:
      id:
        type: string
        required: true
        description: VertNet record identifier
    response:
      format: json
    entity: organism
tests:
  search:
  - name: searches for bear specimens
    params:
      q: Ursus arctos
      limit: 5
    assert:
    - minLength: 1
    allowError: true
