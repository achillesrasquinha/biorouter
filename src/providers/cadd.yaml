name: cadd
displayName: CADD
description: Combined Annotation Dependent Depletion — variant deleteriousness scoring
tags:
- variant-scoring
- pathogenicity
- annotation
- cadd
- deleteriousness
baseUrl: https://cadd.gs.washington.edu/api/v1.0
tools:
  score:
    description: Get CADD deleteriousness score for a specific variant
    tags:
    - variant-score
    - cadd-score
    method: GET
    path: /{version}/{chrom}:{pos}
    params:
      version:
        type: string
        default: GRCh38-v1.7
        description: CADD model version (e.g. GRCh38-v1.7, GRCh37-v1.7)
      chrom:
        type: string
        required: true
        description: Chromosome (e.g. 1, 22, X)
      pos:
        type: integer
        required: true
        description: Genomic position (1-based)
    response:
      format: json
    entity: variant
  getAnnotation:
    description: Get full CADD annotation details for a specific variant
    tags:
    - variant-annotation
    - cadd-annotation
    method: GET
    path: /{version}/{chrom}:{pos}
    params:
      version:
        type: string
        default: GRCh38-v1.7
        description: CADD model version (e.g. GRCh38-v1.7, GRCh37-v1.7)
      chrom:
        type: string
        required: true
        description: Chromosome (e.g. 1, 22, X)
      pos:
        type: integer
        required: true
        description: Genomic position (1-based)
    response:
      format: json
    entity: annotation
tests:
  score:
  - name: scores a well-known pathogenic variant
    params:
      version: GRCh38-v1.7
      chrom: '22'
      pos: 19963748
    assert:
    - minLength: 1
    allowError: true
  getAnnotation:
  - name: gets annotation for a variant
    params:
      version: GRCh38-v1.7
      chrom: '22'
      pos: 19963748
    assert:
    - minLength: 1
    allowError: true
