name: bgee
displayName: Bgee
description: Gene expression evolution database — expression across species and tissues
tags:
- gene-expression
- evolution
- comparative-genomics
- bgee
baseUrl: https://www.bgee.org/api
tools:
  search:
    description: Search genes across species by keyword
    tags:
    - gene-search
    - expression-search
    method: GET
    path: /
    params:
      query:
        type: string
        required: true
        description: Gene name or keyword to search (e.g. "BRCA1", "insulin")
      page:
        type: string
        default: gene
        description: API page type
      action:
        type: string
        default: search
        description: API action
      display_type:
        type: string
        default: json
        description: Response format
    response:
      format: json
      fields:
      - data.result.geneMatches[].gene.geneId
      - data.result.geneMatches[].gene.name
      - data.result.geneMatches[].gene.description
      - data.result.geneMatches[].gene.species.name
      - data.result.geneMatches[].gene.species.id
      - data.result.geneMatches[].gene.geneBioType.name
      - data.result.geneMatches[].match
      - data.result.geneMatches[].matchSource
    entity: gene
  getGene:
    description: Get detailed gene expression info by Ensembl gene ID
    tags:
    - gene-info
    - expression-info
    method: GET
    path: /
    params:
      gene_id:
        type: string
        required: true
        description: Ensembl gene ID (e.g. ENSG00000012048 for BRCA1)
      page:
        type: string
        default: gene
        description: API page type
      action:
        type: string
        default: general_info
        description: API action
      display_type:
        type: string
        default: json
        description: Response format
    response:
      format: json
      fields:
      - data.genes[].geneId
      - data.genes[].name
      - data.genes[].description
      - data.genes[].expressionSummary
      - data.genes[].synonyms
      - data.genes[].species.name
      - data.genes[].species.id
      - data.genes[].geneBioType.name
    entity: gene
tests:
  search:
  - name: searches for BRCA1 gene
    params:
      query: BRCA1
    assert:
    - path: data.result.geneMatches
      minLength: 1
  getGene:
  - name: gets gene info for BRCA1 by Ensembl ID
    params:
      gene_id: ENSG00000012048
    assert:
    - path: data.genes
      minLength: 1
    - path: data.genes.0.name
      equals: BRCA1
