name: igvf
displayName: IGVF
description: IGVF — Impact of Genomic Variation on Function consortium data portal
tags:
  - genomic-variation
  - functional-genomics
  - encode
  - gene
baseUrl: https://api.data.igvf.org
tools:
  searchGenes:
    description: Search IGVF for genes
    tags:
      - gene-search
      - genomic-variation
    method: GET
    path: /search/
    params:
      type:
        type: string
        default: Gene
        description: Object type to search (Gene, MeasurementSet, etc.)
      symbol:
        type: string
        description: Gene symbol (e.g. BRCA1, TP53)
      limit:
        type: integer
        default: 10
        description: Maximum results
      format:
        type: string
        default: json
        description: Response format
    response:
      format: json
      fields:
        - '@graph[].@id'
        - '@graph[].symbol'
        - '@graph[].geneid'
        - '@graph[].dbxrefs'
  searchDatasets:
    description: Search IGVF measurement sets and datasets
    tags:
      - dataset-search
      - experiment-search
    method: GET
    path: /search/
    params:
      type:
        type: string
        default: MeasurementSet
        description: Object type (MeasurementSet, AnalysisSet)
      query:
        type: string
        description: Free text search query
      limit:
        type: integer
        default: 10
        description: Maximum results
      format:
        type: string
        default: json
        description: Response format
    response:
      format: json
tests:
  searchGenes:
    - name: searches for BRCA1
      params:
        type: Gene
        symbol: BRCA1
        limit: 2
        format: json
      assert:
        - path: '@graph'
          minLength: 1
