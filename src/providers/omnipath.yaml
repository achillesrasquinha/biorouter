name: omnipath
displayName: OmniPath
description: OmniPath — comprehensive signaling network and enzyme-substrate interactions
tags:
- signaling
- interactions
- omnipath
- pathways
- network
baseUrl: https://omnipathdb.org
tools:
  getInteractions:
    description: Get signaling interactions for a gene from the OmniPath database
    tags:
    - interaction-search
    - signaling-network
    method: GET
    path: /interactions
    params:
      partners:
        type: string
        required: true
        description: Gene symbol to query (e.g. TP53, EGFR)
      genesymbols:
        type: string
        default: true
        description: Return gene symbols instead of UniProt IDs
      limit:
        type: integer
        default: 25
        description: Maximum number of interactions
      format:
        type: string
        default: json
        description: Response format (json or tsv)
    response:
      format: json
      fields:
      - '[].source_genesymbol'
      - '[].target_genesymbol'
      - '[].is_directed'
      - '[].is_stimulation'
      - '[].is_inhibition'
      - '[].consensus_direction'
      - '[].consensus_stimulation'
      - '[].consensus_inhibition'
    entity: interaction
  getEnzSubstrate:
    description: Get enzyme-substrate relationships for a gene
    tags:
    - enzyme-substrate
    - phosphorylation
    method: GET
    path: /enzsub
    params:
      partners:
        type: string
        required: true
        description: Gene symbol to query (e.g. TP53, AKT1)
      genesymbols:
        type: string
        default: true
        description: Return gene symbols instead of UniProt IDs
      limit:
        type: integer
        default: 25
        description: Maximum number of results
      format:
        type: string
        default: json
        description: Response format (json or tsv)
    response:
      format: json
      fields:
      - '[].enzyme_genesymbol'
      - '[].substrate_genesymbol'
      - '[].residue_type'
      - '[].residue_offset'
      - '[].modification'
    entity: gene
  getAnnotations:
    description: Get protein annotations from OmniPath
    tags:
    - protein-annotations
    - functional-data
    method: GET
    path: /annotations
    params:
      proteins:
        type: string
        required: true
        description: Comma-separated UniProt IDs or gene symbols (e.g. TP53, EGFR)
      resources:
        type: string
        description: Filter by annotation resource
      genesymbols:
        type: string
        default: true
        description: Use gene symbols instead of UniProt IDs
      format:
        type: string
        default: json
        description: Response format (json or tsv)
    response:
      format: json
      fields:
      - '[].uniprot'
      - '[].source'
      - '[].value'
      - '[].record_id'
    entity: annotation
  getComplexes:
    description: Get protein complexes from OmniPath
    tags:
    - protein-complexes
    - complex-data
    method: GET
    path: /complexes
    params:
      proteins:
        type: string
        required: true
        description: Comma-separated UniProt IDs or gene symbols (e.g. TP53, EGFR)
      genesymbols:
        type: string
        default: true
        description: Use gene symbols instead of UniProt IDs
      format:
        type: string
        default: json
        description: Response format (json or tsv)
    response:
      format: json
      fields:
      - '[].name'
      - '[].components'
      - '[].sources'
    entity: interaction
tests:
  getInteractions:
  - name: gets signaling interactions for TP53
    params:
      partners: TP53
      limit: 5
    assert:
    - isArray: true
    - anyOf:
      - 0.source_genesymbol
      - 0.target_genesymbol
  getEnzSubstrate:
  - name: gets enzyme-substrate relationships for AKT1
    params:
      partners: AKT1
      limit: 5
    assert:
    - isArray: true
  getAnnotations:
  - name: gets annotations for TP53
    params:
      proteins: TP53
    assert:
    - isArray: true
      minLength: 1
  getComplexes:
  - name: gets complexes for TP53
    params:
      proteins: TP53
    assert:
    - isArray: true
      minLength: 1
