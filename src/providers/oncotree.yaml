name: oncotree
displayName: OncoTree
description: MSK Cancer Classification — standardized cancer type taxonomy and hierarchy
tags:
- cancer
- oncology
- tumor-types
- classification
- oncotree
baseUrl: https://oncotree.mskcc.org/api
tools:
  getTumorTypes:
    description: Get all tumor types in OncoTree hierarchy
    tags:
    - tumor-types
    - cancer-classification
    method: GET
    path: /tumorTypes
    params: {}
    response:
      format: json
      fields:
      - '[].code'
      - '[].name'
      - '[].mainType'
      - '[].tissue'
      - '[].parent'
      - '[].level'
      - '[].externalReferences'
    entity: disease
  searchTumorType:
    description: Search tumor types by name
    tags:
    - tumor-search
    - cancer-search
    method: GET
    path: /tumorTypes/search/name/{query}
    params:
      query:
        type: string
        required: true
        description: Tumor type name to search for (e.g. melanoma, lung)
    response:
      format: json
      fields:
      - '[].code'
      - '[].name'
      - '[].mainType'
      - '[].tissue'
      - '[].parent'
      - '[].level'
    entity: disease
tests:
  getTumorTypes:
  - name: retrieves all tumor types
    params: {}
    assert:
    - isArray: true
    - minLength: 1
    - path: 0.code
    - path: 0.name
  searchTumorType:
  - name: searches for melanoma tumor types
    params:
      query: melanoma
    assert:
    - isArray: true
    - minLength: 1
    - path: 0.code
    - path: 0.name
