name: npatlas
displayName: Natural Products Atlas
description: Database of microbially-derived natural products for drug discovery
tags:
- natural-products
- microbial
- drug-discovery
- chemistry
- metabolites
baseUrl: https://www.npatlas.org/api/v1
tools:
  search:
    description: Search for natural product compounds by name or keyword
    tags:
    - compound-search
    - natural-product-search
    method: POST
    path: /compounds/basicSearch
    params:
      query:
        type: string
        required: true
        description: Search query (e.g. tetracycline, vancomycin)
    response:
      format: json
      fields:
      - '[].npaid'
      - '[].original_name'
      - '[].mol_formula'
      - '[].mol_weight'
      - '[].exact_mass'
      - '[].original_type'
      - '[].original_organism'
    entity: compound
  getCompound:
    description: Get natural product compound details by NP Atlas ID
    tags:
    - compound-info
    method: GET
    path: /compound/{npatlasId}
    params:
      npatlasId:
        type: string
        required: true
        description: NP Atlas compound ID (e.g. NPA000001)
    response:
      format: json
      fields:
      - npaid
      - original_name
      - mol_formula
      - mol_weight
      - exact_mass
      - smiles
      - origin_organism
      - origin_reference
    entity: compound
tests:
  search:
  - name: searches for tetracycline
    params:
      query: tetracycline
    assert:
    - isArray: true
    - anyOf:
      - 0.original_name
      - 0.npaid
  getCompound:
  - name: gets compound by NP Atlas ID
    params:
      npatlasId: NPA000001
    assert:
    - {}
    - anyOf:
      - original_name
      - npaid
