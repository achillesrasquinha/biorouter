name: cog
displayName: COG
description: Clusters of Orthologous Genes — ortholog classification and functional annotation
tags:
- orthology
- clusters
- cog
- functional-annotation
- microbial-genomics
baseUrl: https://www.ncbi.nlm.nih.gov/research/cog/api
tools:
  searchCOG:
    description: Search COG clusters by COG ID or organism
    tags:
    - cog-search
    - ortholog-search
    method: GET
    path: /cog/
    params:
      cog:
        type: string
        description: COG identifier to search for (e.g. COG0001)
      organism:
        type: string
        description: Organism name to filter by
      page:
        type: integer
        default: 1
        description: Page number for pagination
      per_page:
        type: integer
        default: 10
        description: Number of results per page
    response:
      format: json
      fields:
      - count
      - results[].cog.cogid
      - results[].cog.name
      - results[].gene_tag
      - results[].organism.name
    entity: gene
  getCOG:
    description: Get a specific COG by ID
    tags:
    - cog-info
    - ortholog-info
    method: GET
    path: /cog/
    params:
      cogId:
        type: string
        required: true
        mapsTo: cog
        description: COG identifier (e.g. COG0001)
      per_page:
        type: integer
        default: 5
        description: Number of results per page
    response:
      format: json
      fields:
      - count
      - results[].cog.cogid
      - results[].cog.name
      - results[].gene_tag
      - results[].organism.name
      - results[].bitscore
    entity: gene
tests:
  searchCOG:
  - name: searches for COG0001
    params:
      cog: COG0001
    assert:
    - path: count
      gt: 0
    - path: results
      minLength: 1
    - path: results.0.cog.cogid
      equals: COG0001
  getCOG:
  - name: gets COG0001 details
    params:
      cogId: COG0001
    assert:
    - path: count
      gt: 0
    - path: results
      minLength: 1
    - path: results.0.gene_tag
