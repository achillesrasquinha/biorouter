name: catalogueoflife
displayName: Catalogue of Life
description: Catalogue of Life — global checklist of all known species with authoritative taxonomy
tags:
  - taxonomy
  - species-catalog
  - nomenclature
  - catalogueoflife
  - classification
baseUrl: https://api.catalogueoflife.org
tools:
  searchTaxa:
    description: Search Catalogue of Life for taxa by name
    tags:
      - taxon-search
      - species-search
    method: GET
    path: /dataset/3/nameusage/search
    params:
      query:
        type: string
        required: true
        mapsTo: q
        description: Taxon name to search (e.g. "Felis catus")
      limit:
        type: integer
        default: 5
        description: Maximum number of results
    response:
      format: json
      fields:
        - total
        - result[].id
        - result[].usage.name.scientificName
        - result[].usage.name.authorship
        - result[].usage.name.rank
        - result[].usage.status
        - result[].usage.label
        - result[].classification[].name
        - result[].classification[].rank
  getTaxon:
    description: Get detailed taxon information from Catalogue of Life by ID
    tags:
      - taxon-info
      - classification-detail
    method: GET
    path: /dataset/3/taxon/{id}
    params:
      id:
        type: string
        required: true
        description: Catalogue of Life taxon ID
    response:
      format: json
      fields:
        - id
        - name.scientificName
        - name.authorship
        - name.rank
        - status
        - parentId
        - extinct
        - label
  getNameUsage:
    description: Search name usages in the Catalogue of Life
    tags:
      - name-usage-search
      - nomenclature-search
    method: GET
    path: /dataset/3LR/nameusage/search
    params:
      query:
        type: string
        required: true
        mapsTo: q
        description: Name to search (e.g. "Panthera leo")
      rank:
        type: string
        description: Filter by taxonomic rank (e.g. species, genus)
      limit:
        type: integer
        default: 10
        description: Maximum number of results
    response:
      format: json
      fields:
        - result[].usage.id
        - result[].usage.name.scientificName
        - result[].usage.status
tests:
  searchTaxa:
    - name: searches taxa for Felis catus
      params:
        query: Felis catus
      assert:
        - path: result
          minLength: 1
        - path: total
          gt: 0
    - name: gets taxon by ID
      params:
        query: Felis catus
      assert:
        - path: id
        - path: name
  getNameUsage:
    - name: searches name usages for Panthera leo
      params:
        query: Panthera leo
      assert:
        - path: result
          minLength: 1
