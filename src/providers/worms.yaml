name: worms
displayName: WoRMS
description: World Register of Marine Species — authoritative classification and nomenclature of marine organisms
tags:
- marine
- taxonomy
- species
- worms
baseUrl: https://www.marinespecies.org/rest
tools:
  searchByName:
    description: Search WoRMS for marine species records by scientific name with fuzzy matching
    tags:
    - species-search
    - marine-taxonomy
    method: GET
    path: /AphiaRecordsByName/{name}
    params:
      name:
        type: string
        required: true
        description: Scientific name to search (e.g. "Delphinidae", "Carcharodon carcharias")
      like:
        type: string
        default: 'true'
        description: Enable fuzzy/partial matching
      marine_only:
        type: string
        default: 'false'
        description: Restrict results to marine species only
    response:
      format: json
      fields:
      - '[].AphiaID'
      - '[].scientificname'
      - '[].authority'
      - '[].status'
      - '[].rank'
      - '[].valid_name'
      - '[].kingdom'
      - '[].phylum'
      - '[].class'
      - '[].order'
      - '[].family'
    entity: organism
  getByAphiaId:
    description: Get a single WoRMS species record by its AphiaID identifier
    tags:
    - species-info
    - marine-record
    method: GET
    path: /AphiaRecordByAphiaID/{aphiaId}
    params:
      aphiaId:
        type: integer
        required: true
        description: WoRMS AphiaID numeric identifier (e.g. 136980)
    response:
      format: json
      fields:
      - AphiaID
      - scientificname
      - authority
      - status
      - rank
      - valid_name
      - kingdom
      - phylum
      - class
      - order
      - family
    entity: organism
  getClassification:
    description: Get full taxonomic classification hierarchy by AphiaID
    tags:
    - taxonomy
    - classification
    method: GET
    path: /AphiaClassificationByAphiaID/{aphiaId}
    params:
      aphiaId:
        type: integer
        required: true
        description: WoRMS AphiaID numeric identifier (e.g. 136980)
    response:
      format: json
      fields:
      - scientificname
      - rank
      - AphiaID
      - child.scientificname
      - child.rank
      - child.AphiaID
    entity: organism
  searchByVernacular:
    description: Search WoRMS for species by common or vernacular name
    tags:
    - vernacular-search
    - common-name
    method: GET
    path: /AphiaRecordsByVernacular/{name}
    params:
      name:
        type: string
        required: true
        description: Common or vernacular name to search (e.g. "dolphin", "blue whale")
      like:
        type: string
        default: 'true'
        description: Enable fuzzy/partial matching
    response:
      format: json
      fields:
      - '[].AphiaID'
      - '[].scientificname'
      - '[].authority'
      - '[].status'
      - '[].rank'
      - '[].valid_name'
      - '[].family'
    entity: organism
tests:
  searchByName:
  - name: searches for Delphinidae family
    params:
      name: Delphinidae
    assert:
    - isArray: true
    - path: 0.AphiaID
    - path: 0.scientificname
