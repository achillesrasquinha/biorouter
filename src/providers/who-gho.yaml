name: who-gho
displayName: WHO Global Health Observatory
description: WHO Global Health Observatory — global health indicators, statistics, and country-level health data
tags:
- health-statistics
- who
- global-health
- epidemiology
- indicators
baseUrl: https://ghoapi.azureedge.net/api
tools:
  getIndicators:
    description: Search WHO health indicators by name
    tags:
    - indicator-search
    - health-data
    method: GET
    path: /Indicator
    params:
      query:
        type: string
        required: true
        mapsTo: $filter
        description: OData filter expression (e.g. "contains(IndicatorName,'malaria')")
    response:
      format: json
      fields:
      - value[].IndicatorCode
      - value[].IndicatorName
      - value[].Language
    entity: dataset
  getIndicatorData:
    description: Get data for a specific WHO health indicator optionally filtered by country
    tags:
    - indicator-data
    - country-data
    method: GET
    path: /{indicatorCode}
    params:
      indicatorCode:
        type: string
        required: true
        description: WHO indicator code (e.g. "WHOSIS_000001")
      filter:
        type: string
        mapsTo: $filter
        description: OData filter (e.g. "SpatialDim eq 'USA'")
      top:
        type: integer
        default: 10
        mapsTo: $top
        description: Number of records to return
    response:
      format: json
      fields:
      - value[].IndicatorCode
      - value[].SpatialDim
      - value[].TimeDim
      - value[].Dim1
      - value[].NumericValue
      - value[].Low
      - value[].High
    entity: dataset
tests:
  getIndicators:
  - name: lists indicators containing malaria
    params:
      query: contains(IndicatorName,'malaria')
    assert:
    - path: value
      minLength: 1
    - path: value.0.IndicatorCode
    - path: value.0.IndicatorName
  getIndicatorData:
  - name: gets data for indicator WHOSIS_000001
    params:
      indicatorCode: WHOSIS_000001
    assert:
    - path: value
      minLength: 1
