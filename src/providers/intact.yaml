name: intact
displayName: IntAct
description: Molecular interaction database — curated protein-protein interactions
tags:
  - interaction
  - protein
  - molecular
  - binding
  - intact
baseUrl: https://www.ebi.ac.uk/intact/ws
tools:
  search:
    description: Search IntAct for molecular interactions by gene or protein name
    tags:
      - interaction-search
      - protein-interaction
    method: GET
    path: /interaction/findInteractions/{query}
    params:
      query:
        type: string
        required: true
        description: Gene or protein name to search (e.g. "TP53", "BRCA1")
      page:
        type: integer
        default: 0
      pageSize:
        type: integer
        default: 10
    response:
      format: json
      fields:
        - content[].ac
        - content[].moleculeA
        - content[].moleculeB
        - content[].uniqueIdA
        - content[].uniqueIdB
        - content[].typeA
        - content[].typeB
        - content[].taxIdA
        - content[].taxIdB
        - content[].miscore
  findInteractor:
    description: Find interactor details by gene or protein name
    tags:
      - interactor-search
      - protein-info
    method: GET
    path: /interactor/findInteractor/{query}
    params:
      query:
        type: string
        required: true
        description: Gene or protein name (e.g. "TP53")
      page:
        type: integer
        default: 0
      pageSize:
        type: integer
        default: 10
    response:
      format: json
      fields:
        - content[].interactorAc
        - content[].interactorName
        - content[].interactorPreferredIdentifier
        - content[].interactorDescription
        - content[].interactorType
        - content[].interactorSpecies
        - content[].interactorTaxId
        - content[].interactionCount
  getInteraction:
    description: Get interaction details by IntAct accession
    tags:
      - interaction-details
      - accession
    method: GET
    path: /interaction/{ac}
    params:
      ac:
        type: string
        required: true
        description: IntAct interaction accession (e.g. EBI-12345678)
    response:
      format: json
      fields:
        - interaction.ac
        - interaction.detectionMethods[].name
        - interaction.type.name
        - interaction.participants[].interactor.accession
  getComplex:
    description: Search protein complexes in IntAct Complex Portal
    tags:
      - complex
      - protein-complex
    method: GET
    path: /complex/search
    params:
      query:
        type: string
        required: true
        description: Search query for complexes (e.g. "p53", "proteasome")
      first:
        type: integer
        default: 0
        description: Offset for pagination
      number:
        type: integer
        default: 10
        description: Number of results to return
    response:
      format: json
      fields:
        - elements[].complexAC
        - elements[].complexName
        - elements[].description
        - elements[].organismName
  getInteractorDetails:
    description: Get detailed information about a specific interactor
    tags:
      - interactor-details
      - protein-info
    method: GET
    path: /interactor/{ac}
    params:
      ac:
        type: string
        required: true
        description: IntAct interactor accession (e.g. EBI-12345678)
    response:
      format: json
      fields:
        - interactor.accession
        - interactor.organism.taxId
        - interactor.type.name
        - interactor.xrefs[].id
tests:
  search:
    - name: searches for TP53 interactions
      params:
        query: P04637
      assert:
        - path: content
          minLength: 1
        - anyOf:
            - content.0.moleculeA
            - content.0.moleculeB
  findInteractor:
    - name: finds interactor details for TP53
      params:
        query: TP53
      assert:
        - path: content
          minLength: 1
        - path: content.0.interactorName
  getInteraction:
    - name: gets interaction details by accession
      params:
        ac: EBI-12345678
      assert:
        - path: interaction.ac
  getComplex:
    - name: searches for p53 protein complexes
      params:
        query: p53
      assert:
        - path: elements
          minLength: 1
        - path: elements.0.complexAC
  getInteractorDetails:
    - name: gets interactor details by accession
      params:
        ac: EBI-12345678
      assert:
        - path: interactor.accession
