name: targetmine
displayName: TargetMine
description: TargetMine — integrated data warehouse for drug target prioritization and biomarker discovery
tags:
  - drug-targets
  - biomarkers
  - intermine
  - targetmine
baseUrl: https://targetmine.mizuguchilab.org/targetmine/service
tools:
  search:
    description: Search TargetMine for genes, drugs, diseases, and pathways
    tags:
      - target-search
      - drug-target
    method: GET
    path: /search
    params:
      q:
        type: string
        required: true
        description: Search query (e.g. TP53, kinase, breast cancer)
      format:
        type: string
        default: json
        description: Response format
      size:
        type: integer
        default: 10
        description: Number of results
    response:
      format: json
      fields:
        - totalHits
        - results[].id
        - results[].type
        - results[].fields
tests:
  search:
    - name: searches for TP53
      params:
        q: TP53
        format: json
        size: 3
      assert:
        - path: totalHits
        - path: results
          minLength: 1
