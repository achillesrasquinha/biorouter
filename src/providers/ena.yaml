name: ena
displayName: European Nucleotide Archive
description: Open-access nucleotide sequence data and associated information
tags:
- nucleotide
- sequence
- genomics
- ena
- dna
- rna
baseUrl: https://www.ebi.ac.uk/ena
tools:
  search:
    description: Search ENA for nucleotide sequences
    tags:
    - sequence-search
    - nucleotide-search
    method: GET
    path: /portal/api/search
    params:
      query:
        type: string
        required: true
        mapsTo: query
        description: Search query in ENA syntax (e.g. description="*insulin*")
      result:
        type: string
        default: sequence
        description: Result type (sequence, study, sample, etc.)
      limit:
        type: integer
        default: 10
        description: Maximum number of results
      fields:
        type: string
        default: accession,description,tax_id
        description: Comma-separated fields to return
      format:
        type: string
        default: json
    response:
      format: json
      fields:
      - '[].accession'
      - '[].description'
      - '[].tax_id'
    entity: sequence
  getSummary:
    description: Get summary information for an ENA accession
    tags:
    - sequence-info
    - accession-lookup
    method: GET
    path: /browser/api/summary/{accession}
    params:
      accession:
        type: string
        required: true
        description: ENA accession (e.g. AB000100)
    response:
      format: json
      fields:
      - summaries[].accession
      - summaries[].description
      - summaries[].moleculeType
      - summaries[].sequenceLength
      - summaries[].taxon
      - summaries[].firstPublic
    entity: dataset
tests:
  search:
  - name: searches for insulin sequences
    params:
      query: description="*insulin*"
    assert:
    - isArray: true
    - path: 0.accession
  getSummary:
  - name: gets summary for accession AB000100
    params:
      accession: AB000100
    assert:
    - path: summaries
      minLength: 1
    - path: summaries.0.accession
      equals: AB000100
