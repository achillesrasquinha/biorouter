name: clinicaltrials
displayName: ClinicalTrials.gov
description: Registry of clinical studies conducted around the world
tags:
- clinical-trials
- drugs
- diseases
- interventions
- fda
baseUrl: https://clinicaltrials.gov/api/v2
tools:
  search:
    description: Search clinical trials by condition, drug, or keyword
    tags:
    - trial-search
    - condition
    - intervention
    method: GET
    path: /studies
    params:
      query:
        type: string
        required: true
        mapsTo: query.term
        description: Search terms (e.g. "lung cancer pembrolizumab")
      pageSize:
        type: integer
        default: 5
        mapsTo: pageSize
    response:
      format: json
      fields:
      - studies[].protocolSection.identificationModule.nctId
      - studies[].protocolSection.identificationModule.briefTitle
      - studies[].protocolSection.statusModule.overallStatus
      - studies[].protocolSection.designModule.phases
      - studies[].protocolSection.conditionsModule.conditions
      - studies[].protocolSection.armsInterventionsModule.interventions[].name
    entity: compound
  getStudy:
    description: Get details of a specific clinical trial by NCT ID
    tags:
    - trial-info
    - nct
    method: GET
    path: /studies/{nctId}
    params:
      nctId:
        type: string
        required: true
        description: NCT identifier (e.g. NCT04280705)
    response:
      format: json
      fields:
      - protocolSection.identificationModule.nctId
      - protocolSection.identificationModule.briefTitle
      - protocolSection.identificationModule.officialTitle
      - protocolSection.statusModule.overallStatus
      - protocolSection.designModule.phases
      - protocolSection.designModule.enrollmentInfo
      - protocolSection.conditionsModule.conditions
      - protocolSection.descriptionModule.briefSummary
      - protocolSection.armsInterventionsModule.interventions
      - protocolSection.sponsorCollaboratorsModule.leadSponsor
    entity: dataset
tests:
  search:
  - name: searches for lung cancer trials
    params:
      query: lung cancer pembrolizumab
    assert:
    - path: studies
      minLength: 1
