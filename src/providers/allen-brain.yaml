name: allen-brain
displayName: Allen Brain Atlas
description: Allen Institute brain gene expression and connectivity data
tags:
- brain
- neuroscience
- gene-expression
- allen-institute
- mouse
- human
baseUrl: https://api.brain-map.org/api/v2
tools:
  searchGene:
    description: Search gene expression data
    tags:
    - gene-search
    - brain-expression
    method: GET
    path: /data/query.json
    params:
      criteria:
        type: string
        required: true
        description: RMA query e.g. 'model::Gene,rma::criteria,[acronym$eq'BDNF']'
    response:
      format: json
      fields:
      - msg[].id
      - msg[].acronym
      - msg[].name
      - msg[].entrez_id
      - msg[].chromosome_id
      - msg[].organism_id
    entity: gene
  getStructures:
    description: Get brain structures
    tags:
    - brain-structures
    - anatomy
    method: GET
    path: /data/Structure/query.json
    params:
      criteria:
        type: string
        default: model::Structure,rma::criteria,[ontology_id$eq1]
        description: RMA criteria for brain structures
    response:
      format: json
      fields:
      - msg[].id
      - msg[].acronym
      - msg[].name
      - msg[].parent_structure_id
      - msg[].ontology_id
      - msg[].depth
      - msg[].structure_id_path
    entity: structure
tests:
  getStructures:
  - name: gets brain structures with default criteria
    params: {}
    assert:
    - {}
