name: name-resolution
displayName: RENCI Name Resolution
description: RENCI Name Resolution — Translator service mapping text labels to biomedical CURIEs
tags:
  - name-resolution
  - identifier-mapping
  - translator
  - curie
baseUrl: https://name-resolution-sri.renci.org
tools:
  lookup:
    description: Resolve a text label to standardized biomedical identifiers (CURIEs)
    tags:
      - name-lookup
      - identifier-mapping
    method: GET
    path: /lookup
    params:
      string:
        type: string
        required: true
        description: Text to resolve (e.g. BRCA1, aspirin, diabetes mellitus)
      limit:
        type: integer
        default: 10
        description: Maximum results
    response:
      format: json
      fields:
        - '[].curie'
        - '[].label'
        - '[].synonyms'
tests:
  lookup:
    - name: resolves BRCA1 to identifiers
      params:
        string: BRCA1
        limit: 5
      assert:
        - minLength: 1
