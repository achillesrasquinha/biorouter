name: disgenet
displayName: DisGeNET
description: Gene-disease association database
tags: [gene-disease, disease-associations, variants, genetics]
baseUrl: https://www.disgenet.org/api

auth:
  type: header
  header: Authorization
  env: LS_DISGENET_API_KEY

tools:
  getGeneAssociations:
    description: Get diseases associated with a gene by NCBI gene ID
    tags: [gene-disease, disease-lookup]
    method: GET
    path: /gda/gene/{geneId}
    params:
      geneId:
        type: string
        required: true
        description: NCBI gene ID (e.g. 1017 for CDK2)
      source:
        type: string
        default: ALL
        description: Source filter (ALL, CURATED, PREDICTED)
      format:
        type: string
        default: json
    response:
      format: json
  searchDisease:
    description: Search diseases by name
    tags: [disease-search, disease-info]
    method: GET
    path: /disease/search/{query}
    params:
      query:
        type: string
        required: true
        description: Disease name (e.g. asthma)
      format:
        type: string
        default: json
    response:
      format: json
      fields:
        - payload[].diseaseid
        - payload[].disease_name
        - payload[].disease_type
        - payload[].disease_class_name

  getVariantDisease:
    description: Search variant-disease associations
    tags: [variant-disease, variant-associations]
    method: GET
    path: /vda/variant/{variant}
    params:
      variant:
        type: string
        required: true
        description: Variant identifier (e.g. rs7412)
      source:
        type: string
        default: ALL
        description: Source filter (ALL, CURATED, PREDICTED)
      format:
        type: string
        default: json
    response:
      format: json
  getDiseaseGenes:
    description: Search disease-gene associations by disease
    tags: [disease-gene, disease-associations]
    method: GET
    path: /gda/disease/{disease}
    params:
      disease:
        type: string
        required: true
        description: Disease UMLS CUI (e.g. C0002395 for Alzheimer)
      source:
        type: string
        default: ALL
        description: Source filter (ALL, CURATED, PREDICTED)
      format:
        type: string
        default: json
    response:
      format: json

tests:
  getGeneAssociations:
    - name: gets disease associations for CDK2
      params:
        geneId: "1017"
      assert:
        - minLength: 1
      allowError: true
  searchDisease:
    - name: searches for asthma
      params:
        query: asthma
      assert:
        - minLength: 1
      allowError: true
  getVariantDisease:
    - name: gets disease associations for rs7412
      params:
        variant: rs7412
      assert:
        - minLength: 1
      allowError: true
  getDiseaseGenes:
    - name: gets gene associations for Alzheimer disease
      params:
        disease: C0002395
      assert:
        - minLength: 1
      allowError: true
