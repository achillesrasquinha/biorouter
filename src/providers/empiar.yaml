name: empiar
displayName: EMPIAR
description: Electron Microscopy Public Image Archive for raw EM data
tags:
- electron-microscopy
- imaging
- empiar
- ebi
- structure
baseUrl: https://www.ebi.ac.uk/empiar/api
tools:
  getEntry:
    description: Get EMPIAR entry details by numeric ID
    tags:
    - em-entry
    - em-detail
    method: GET
    path: /entry/{empiarId}/
    params:
      empiarId:
        type: string
        required: true
        description: EMPIAR entry ID e.g. 'EMPIAR-10028' or '10028'
    response:
      format: json
      fields:
      - '*.title'
      - '*.imagesets[].name'
      - '*.imagesets[].category'
      - '*.imagesets[].data_format'
      - '*.imagesets[].num_images_or_tilt_series'
      - '*.imagesets[].pixel_width'
    entity: dataset
tests:
  getEntry:
  - name: gets a specific EMPIAR entry
    params:
      empiarId: EMPIAR-10028
    assert:
    - {}
