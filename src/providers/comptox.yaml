name: comptox
displayName: CompTox
description: EPA CompTox Chemicals Dashboard for toxicology and chemical safety
tags:
  - toxicology
  - chemical
  - epa
  - safety
  - environmental
  - comptox
baseUrl: https://comptox.epa.gov/dashboard-api
tools:
  searchChemical:
    description: Search chemicals by name prefix in CompTox
    tags:
      - chemical-search
      - comptox-search
    method: GET
    path: /ccdapp1/search/chemical/start-with/{query}
    params:
      query:
        type: string
        required: true
        description: Chemical name prefix to search (e.g. "bisphenol", "atrazine")
    response:
      format: json
      fields:
        - "[].dtxsid"
        - "[].dtxcid"
        - "[].searchWord"
        - "[].searchMatch"
        - "[].rank"
        - "[].hasStructureImage"
  searchContain:
    description: Search chemicals by name substring in CompTox
    tags:
      - chemical-search
      - comptox-contain
    method: GET
    path: /ccdapp1/search/chemical/contain/{query}
    params:
      query:
        type: string
        required: true
        description: Chemical name substring to search (e.g. "bisphenol", "phthalate")
    response:
      format: json
      fields:
        - "[].dtxsid"
        - "[].dtxcid"
        - "[].searchWord"
        - "[].searchMatch"
        - "[].rank"
        - "[].hasStructureImage"
  getChemicalDetails:
    description: Get detailed chemical information by DTXSID
    tags:
      - chemical-detail
      - comptox-detail
    method: GET
    path: /ccdapp1/search/chemical/equal/{dtxsid}
    params:
      dtxsid:
        type: string
        required: true
        description: DSSTox substance identifier (e.g. DTXSID7020182 for bisphenol A)
    response:
      format: json
      fields:
        - "[].dtxsid"
        - "[].preferredName"
        - "[].casrn"
        - "[].molecularFormula"
  searchByName:
    description: Search chemicals by exact name in CompTox
    tags:
      - chemical-search
      - comptox-name-search
    method: GET
    path: /ccdapp1/search/chemical/equal/{name}
    params:
      name:
        type: string
        required: true
        description: Chemical name to search (e.g. "Bisphenol A", "Atrazine")
    response:
      format: json
      fields:
        - "[].dtxsid"
        - "[].dtxcid"
        - "[].searchWord"
        - "[].searchMatch"
        - "[].rank"
tests:
  searchChemical:
    - name: searches for bisphenol chemicals
      params:
        query: bisphenol
      assert:
        - {}
        - isArray: true
  getChemicalDetails:
    - name: gets chemical details for DTXSID7020182
      params:
        dtxsid: DTXSID7020182
      assert:
        - {}
        - isArray: true
  searchByName:
    - name: searches for Bisphenol A by name
      params:
        name: Bisphenol A
      assert:
        - {}
        - isArray: true
  searchContain:
    - name: searches for phthalate chemicals by substring
      params:
        query: phthalate
      assert:
        - {}
        - isArray: true
