name: pharmgkb
displayName: PharmGKB (CPIC)
description: CPIC pharmacogenomics knowledge base — drug-gene pairs, clinical guidelines, and pharmacogenomic recommendations
tags:
- pharmacogenomics
- drug-gene
- pharmgkb
- clinical
- pgx
baseUrl: https://api.cpicpgx.org/v1
tools:
  searchDrugs:
    description: Search for drugs by name in the CPIC pharmacogenomics database
    tags:
    - drug-search
    - pgx-drug
    method: GET
    path: /drug
    params:
      name:
        type: string
        required: true
        mapsTo: name
        description: Drug name (e.g. "warfarin")
        prefix: eq.
    response:
      format: json
      fields:
      - '[].drugid'
      - '[].name'
      - '[].rxnormid'
      - '[].drugbankid'
      - '[].atcid'
      - '[].guidelineid'
    entity: compound
  getDrugGenePairs:
    description: Get drug-gene interaction pairs for a specific drug
    tags:
    - drug-gene-pairs
    - pgx-pairs
    method: GET
    path: /pair
    params:
      drugid:
        type: string
        required: true
        mapsTo: drugid
        description: Drug ID (e.g. "RxNorm:11289" for warfarin)
        prefix: eq.
    response:
      format: json
      fields:
      - '[].pairid'
      - '[].genesymbol'
      - '[].drugid'
      - '[].guidelineid'
      - '[].usedforrecommendation'
      - '[].cpiclevel'
      - '[].clinpgxlevel'
      - '[].pgxtesting'
    entity: gene
  getGene:
    description: Get gene details by symbol from CPIC database
    tags:
    - gene-info
    - pgx-gene
    method: GET
    path: /gene
    params:
      symbol:
        type: string
        required: true
        description: Gene symbol (e.g. CYP2D6)
        prefix: eq.
    response:
      format: json
      fields:
      - '[].symbol'
      - '[].chr'
      - '[].hgncid'
      - '[].ncbiid'
      - '[].ensemblid'
      - '[].lookupmethod'
    entity: gene
  getAlleles:
    description: Get allele definitions for a gene
    tags:
    - allele-info
    - pgx-allele
    method: GET
    path: /allele
    params:
      genesymbol:
        type: string
        required: true
        description: Gene symbol (e.g. CYP2D6)
        prefix: eq.
      select:
        type: string
        default: name,functionalstatus,clinicalfunctionalstatus,activityvalue
        description: Columns to select
    response:
      format: json
      fields:
      - '[].name'
      - '[].functionalstatus'
      - '[].clinicalfunctionalstatus'
      - '[].activityvalue'
    entity: variant
  getGuidelines:
    description: Get CPIC clinical guidelines
    tags:
    - guideline-info
    - pgx-guideline
    method: GET
    path: /guideline
    params:
      select:
        type: string
        default: id,name,url,genes,drugs
        description: Columns to select
      limit:
        type: integer
        default: 10
        description: Maximum number of results to return
    response:
      format: json
      fields:
      - '[].id'
      - '[].name'
      - '[].url'
      - '[].genes'
      - '[].drugs'
    entity: annotation
  getRecommendations:
    description: Get dosing recommendations for a drug-gene pair
    tags:
    - recommendation-info
    - pgx-recommendation
    method: GET
    path: /recommendation
    params:
      drugid:
        type: string
        required: true
        description: Drug ID (e.g. RxNorm:11289 for warfarin)
        prefix: eq.
      select:
        type: string
        default: drugid,implications,drugrecommendation,classification
        description: Columns to select
    response:
      format: json
      fields:
      - '[].drugid'
      - '[].implications'
      - '[].drugrecommendation'
      - '[].classification'
    entity: annotation
tests:
  searchDrugs:
  - name: searches for warfarin
    params:
      name: eq.warfarin
    assert:
    - isArray: true
    - path: 0.name
      equals: warfarin
  getDrugGenePairs:
  - name: gets drug-gene pairs for warfarin (RxNorm:11289)
    params:
      drugid: eq.RxNorm:11289
    assert:
    - isArray: true
    - path: 0.genesymbol
  getGene:
  - name: gets gene details for CYP2D6
    params:
      symbol: eq.CYP2D6
    assert:
    - isArray: true
    - path: 0.symbol
      equals: CYP2D6
  getAlleles:
  - name: gets allele definitions for CYP2D6
    params:
      genesymbol: eq.CYP2D6
    assert:
    - isArray: true
    - path: 0.name
  getGuidelines:
  - name: lists CPIC guidelines
    params:
      limit: 5
    assert:
    - isArray: true
    - path: 0.name
  getRecommendations:
  - name: gets recommendations for warfarin
    params:
      drugid: eq.RxNorm:11289
    assert:
    - isArray: true
